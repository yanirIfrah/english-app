<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לירד נוכחות">
<title>לירד שעון נוכחות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;--pri:#0f766e;--pri-2:#115e59;--pri-soft:#ccfbf1;--ok:#059669;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#dc2626;--bad-soft:#fee2e2;--vac:#2563eb;--vac-soft:#dbeafe;--sick:#c2410c;--sick-soft:#ffedd5;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;margin:0 -14px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;flex:1;min-width:0}.brand .lg{width:34px;height:34px;flex:none}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600;max-width:46vw}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}.chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pri-soft);color:var(--pri-2);white-space:nowrap}
.badge.mgr{background:var(--warn-soft);color:var(--warn)}.badge.lock{background:var(--bad-soft);color:var(--bad)}.badge.gray{background:#eef2f6;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0}h3{font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;min-height:44px}
.btn:hover{background:var(--pri-2)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:var(--bad)}.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}.btn.block{width:100%}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;color:var(--ink-2)}
.field{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px;outline:none}
.field:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.field.ltr{direction:ltr;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}.ok{color:var(--ok);font-size:14px;min-height:20px;margin-top:8px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px}.check input{width:18px;height:18px;accent-color:var(--pri)}
.auth{max-width:420px;margin:6vh auto 0}.auth .lgbig{width:64px;height:64px;margin:0 auto 10px;display:block}
.auth h1{text-align:center}.auth .sub{text-align:center}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month h2{font-size:20px;text-align:center;flex:1}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;color:var(--ink-2)}.ib:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat .v{font-size:21px;font-weight:800;line-height:1.2}.stat .l{font-size:12.5px;color:var(--muted)}
.stat.vac .v{color:var(--vac)}.stat.sick .v{color:var(--sick)}.stat.ot .v{color:var(--warn)}
.today{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);border-color:#99f6e4}
.today .t1{font-weight:700}.today .t2{color:var(--ink-2);font-size:14px}
.days{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.day{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eef2f6;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.day:last-child{border-bottom:0}.day:hover{background:#f8fafc}.day.we{background:#fafbfc}.day.td{background:#f0fdfa}.day.ro{cursor:default}.day.ro:hover{background:inherit}
.dnum{width:44px;flex:none;text-align:center;line-height:1.1}.dnum b{display:block;font-size:18px}.dnum span{font-size:11.5px;color:var(--muted)}
.dmain{flex:1;min-width:0;font-size:14.5px}.dmain .tm{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.dmain .nt{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtot{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;min-width:46px;text-align:left}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-inline-end:6px}
.pill.vac{background:var(--vac-soft);color:var(--vac)}.pill.sick{background:var(--sick-soft);color:var(--sick)}.pill.empty{color:#94a3b8;font-weight:500;padding:0}
.lockic{color:#94a3b8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f5f9;border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}.seg button.on.vac{color:var(--vac)}.seg button.on.sick{color:var(--sick)}
.tw{display:flex;gap:6px}.tw .field{flex:1;min-width:0;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}.tw .btn{padding:0 10px;flex:none}
.times{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:480px){.times{grid-template-columns:1fr 1fr;gap:10px}}
.total{margin-top:14px;background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.total b{font-size:20px;direction:ltr}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #eef2f6;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.list .it:last-child{border-bottom:0}.list .it:hover{background:#f8fafc}
.list .nm{flex:1;min-width:0}.list .nm b{display:block}.list .nm span{font-size:13px;color:var(--muted)}
.list .fig{text-align:left;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.list .fig b{display:block;font-size:17px;color:var(--ink);direction:ltr}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:6px;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;font-weight:600;text-align:right}.menu button:hover{background:#f1f5f9}
.menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.menu .mh b{display:block}.menu .mh span{font-size:13px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(15,118,110,.25);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);text-align:center;padding:26px 12px}
svg.i{width:18px;height:18px;flex:none}
/* ---------- printable report ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
}
.rep{font-family:Arial,"Segoe UI",sans-serif;color:#000;font-size:11.5px;direction:rtl}
.rep+.rep{page-break-before:always;break-before:page}
.rep .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0f766e;padding-bottom:8px;margin-bottom:10px}
.rep .rh h1{font-size:19px;margin:0;color:#0f766e}.rep .rh .co{font-size:15px;font-weight:700}
.rep .meta{display:grid;grid-template-columns:repeat(4,auto);gap:4px 18px;margin-bottom:10px;font-size:12px}.rep .meta b{font-weight:700}
.rep table{width:100%;border-collapse:collapse}.rep th,.rep td{border:1px solid #cbd5e1;padding:3px 5px;text-align:center}
.rep th{background:#f0fdfa;font-weight:700}.rep tr.we td{background:#f8fafc}.rep td.nt{text-align:right;max-width:150px}
.rep td.tm{direction:ltr}.rep .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rep .sum div{border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px}.rep .sum b{display:block;font-size:14px}
.rep .sig{display:flex;justify-content:space-between;margin-top:26px;gap:30px}.rep .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
.rep .foot{margin-top:10px;font-size:10px;color:#64748b}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal-root"></div>
<div id="print-root"></div>
<script src="lib/supabase.js"></script>
<script>
"use strict";
/* ========================== basics ========================== */
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EMAIL_DOMAIN="users.lirad-shaon.app";
const toEmail=u=>"u"+[...new TextEncoder().encode(String(u).toLowerCase())].map(b=>b.toString(16).padStart(2,"0")).join("")+"@"+EMAIL_DOMAIN;
const normUser=u=>String(u||"").trim().toLowerCase();
const validUser=u=>/^[a-z0-9֐-׿._-]{3,20}$/.test(u);
const APP_NAME="לירד שעון נוכחות";
const LOGO=`<svg viewBox="0 0 64 64" class="lg" aria-hidden="true"><defs><linearGradient id="lgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lgg)"/><circle cx="32" cy="33" r="19" fill="#fff"/><circle cx="32" cy="33" r="19" fill="none" stroke="#99f6e4" stroke-width="3"/><path d="M32 21v12l8 5" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="27" y="8" width="10" height="5" rx="2" fill="#fff"/><circle cx="47" cy="47" r="9" fill="#f59e0b" stroke="#fff" stroke-width="2.5"/><path d="M43 47l3 3 5-6" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICONS={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',back:'<path d="M9 18l6-6-6-6"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 note:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12l5 5L20 7"/>'};
const icon=(n,s=18)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
function toast(t,ms=2600){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }
const closeModal=()=>{ $("#modal-root").innerHTML=""; };

/* ========================== dates & hours ========================== */
const HEB_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const HEB_DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"], HEB_D1=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=()=>ymd(new Date());
const curYM=()=>todayStr().slice(0,7);
const ymAdd=(ym,n)=>{ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ymLabel=ym=>{ const [y,m]=ym.split("-").map(Number); return `${HEB_MONTHS[m-1]} ${y}`; };
const daysIn=ym=>{ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };
const dowOf=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getDay(); };
const dLabel=s=>{ const [y,m,d]=s.split("-").map(Number); return `יום ${HEB_DAYS[dowOf(s)]}, ${d}.${m}.${y}`; };
const tmin=t=>{ if(!t) return null; const [h,m]=String(t).split(":").map(Number); return h*60+m; };
const hhmm=t=>t?String(t).slice(0,5):"";
function entryMin(e){ if(!e||e.kind!=="work"||!e.start_time||!e.end_time) return 0; let m=tmin(e.end_time)-tmin(e.start_time); if(m<=0) m+=1440; return Math.max(0,m-(e.break_min||0)); }
const fmtH=m=>`${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
const decH=m=>(Math.round(m/60*100)/100).toFixed(2);
function splitOT(m){ const std=Math.round((Number(S.cfg.stdHours)||8.6)*60); const reg=Math.min(m,std), o1=Math.min(Math.max(m-std,0),120), o2=Math.max(m-std-120,0); return {reg,o1,o2}; }
function editWindow(){ const n=Math.max(0,parseInt(S.cfg.editMonths,10)||2), cm=curYM(); return {from:ymAdd(cm,-n)+"-01", to:ymAdd(cm,2)+"-01"}; } // to = exclusive
function canEditDay(uid,day){ if(canDo("editHours")) return true; if(uid!==S.me.id) return false; const w=editWindow(); return day>=w.from&&day<w.to; }

/* ========================== state & server ========================== */
const S={sb:null,cfg:{},me:null,tab:"my",ym:curYM(),view:null,users:[],ent:{},chan:null};
const isStaff=()=>S.me&&(S.me.role==="admin"||S.me.role==="manager");
const canDo=p=>S.me&&!S.me.locked&&(S.me.role==="admin"||(S.me.role==="manager"&&!!(S.me.perms||{})[p]));
async function api(action,payload={}){
  const {data}=await S.sb.auth.getSession(); const tok=data&&data.session&&data.session.access_token;
  const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json",...(tok?{authorization:"Bearer "+tok}:{})},body:JSON.stringify({action,...payload})});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw {code:j.error||"error"}; return j;
}
const API_ERR={taken:"שם המשתמש הזה כבר תפוס",signup_closed:"ההרשמה סגורה. חשבונות חדשים נפתחים על ידי המנהל.",weak_password:"הסיסמה צריכה להכיל לפחות 6 תווים",

function subscribe(){
  if(S.chan){ try{ S.sb.removeChannel(S.chan); }catch(e){} }
  S.chan=S.sb.channel("live-"+S.me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"entries"},()=>{ clearTimeout(S._rt); S._rt=setTimeout(()=>{ if(!$(".modal")) refresh(); },700); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles",filter:"id=eq."+S.me.id},pl=>{ const r=pl.new; if(r.locked) return signOut("החשבון נחסם. יש לפנות למנהל."); S.me={...S.me,...r}; if(!$(".modal")) render(); })

let FAILS=0, LOCK_UNTIL=0;

  authShell(`<h1>${APP_NAME}</h1><p class="sub">כניסה לחשבון – מכל מכשיר</p>
    <form id="lf" autocomplete="on"><label class="lbl" for="lu">שם משתמש</label><input class="field ltr" id="lu" autocomplete="username" autocapitalize="off" spellcheck="false" dir="ltr">

    const u=normUser($("#lu").value), pw=$("#lp").value; if(!u||!pw) return err.textContent="נא למלא שם משתמש וסיסמה";

async function enter(errEl){

  S.sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",me.id).then(()=>{});

function wireSignup(first){
  $("#sf").onsubmit=async ev=>{

function monthSummary(list){
  const s={days:0,min:0,reg:0,o1:0,o2:0,vac:0,sick:0};
  list.forEach(e=>{ if(e.kind==="work"){ const m=entryMin(e); s.days++; s.min+=m; const o=splitOT(m); s.reg+=o.reg; s.o1+=o.o1; s.o2+=o.o2; } else if(e.kind==="vacation") s.vac++; else if(e.kind==="sick") s.sick++; });
  return s;
}

      :`<div class="hint" style="margin-top:12px">${st.kind==="vacation"?"היום יירשם כיום חופש.":"היום יירשם כיום מחלה. אם יש אישור מחלה – כדאי לציין בהערה."}</div>`}
      <label class="lbl" for="tn">הערה (לא חובה)</label><input class="field" id="tn" maxlength="300" value="${esc(st.note)}">
      <div class="err" id="derr"></div>
      <div class="row"><div>${e?`<button class="btn ghost" id="ddel" type="button">${icon("trash",16)} מחיקה</button>`:""}</div><div class="actions"><button class="btn ghost" id="dcan" type="button">ביטול</button><button class="btn" id="dsave" type="button">${icon("check",16)} שמירה</button></div></div>
    </div></div>`;
    $("#mx").onclick=$("#dcan").onclick=closeModal;
    $("#modal-root").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ keep(); st.kind=b.dataset.k; draw(); });
    $("#modal-root").querySelectorAll("[data-now]").forEach(b=>b.onclick=()=>{ keep(); const d=new Date(); st[b.dataset.now==="ts"?"start":"end"]=`${pad(d.getHours())}:${pad(d.getMinutes())}`; draw(); });
    ["ts","te","tb"].forEach(id=>{ const el=$("#"+id); if(el) el.onchange=()=>{ keep(); draw(); }; });
    $("#dsave").onclick=save; const dl=$("#ddel"); if(dl) dl.onclick=del;
  };
  const keep=()=>{ const g=id=>$("#"+id); if(g("ts")){ st.start=g("ts").value; st.end=g("te").value; st.brk=parseInt(g("tb").value,10)||0; } st.note=g("tn").value; };
  const save=async()=>{
    keep(); const err=$("#derr");
    if(st.kind==="work"){ if(!st.start||!st.end) return err.textContent="נא למלא שעת כניסה ושעת יציאה"; if(st.start===st.end) return err.textContent="שעת היציאה זהה לשעת הכניסה";
      if(entryMin({kind:"work",start_time:st.start,end_time:st.end,break_min:st.brk})<=0) return err.textContent="ההפסקה ארוכה מזמן העבודה"; }
    $("#dsave").disabled=true; err.innerHTML='<span class="spin"></span>';
    const row={user_id:uid,day,kind:st.kind,start_time:st.kind==="work"?st.start:null,end_time:st.kind==="work"?st.end:null,break_min:st.kind==="work"?st.brk:0,note:st.note.trim()};
    const {error}=await S.sb.from("entries").upsert(row,{onConflict:"user_id,day"});
    if(error){ $("#dsave").disabled=false; return err.textContent=/row-level|policy|permission/i.test(error.message||"")?"אין הרשאה לשנות את היום הזה (מחוץ לטווח העריכה).":"השמירה נכשלה. נסו שוב."; }
    if(st.kind==="work"&&uid===S.me.id) try{ localStorage.setItem("lirad.last",JSON.stringify({start:st.start,end:st.end,brk:st.brk})); }catch(x){}
    closeModal(); toast("נשמר ✓"); refresh();
  };
  const del=async()=>{
    if(!confirm("למחוק את הרישום של היום הזה?")) return;
    const {error}=await S.sb.from("entries").delete().eq("user_id",uid).eq("day",day);
    if(error) return $("#derr").textContent="המחיקה נכשלה.";
    closeModal(); toast("הרישום נמחק"); refresh();
  };
  draw();
}

function printReports(packs,ym){
  if(!packs.length) return toast("אין נתונים להדפסה");
  const root=$("#print-root"); root.innerHTML=packs.map(p=>reportHTML(p.user,p.list,ym)).join("");
  const t=document.title; document.title=packs.length===1?fileBase(packs[0].user,ym):`דוחות נוכחות - ${ym}`;
  document.body.classList.add("printing");
  const done=()=>{ document.body.classList.remove("printing"); document.title=t; root.innerHTML=""; window.removeEventListener("afterprint",done); };
  window.addEventListener("afterprint",done);
  toast("בחלון ההדפסה בחרו \"שמירה כ-PDF\"",3500);
  setTimeout(()=>{ window.print(); setTimeout(()=>{ if(!matchMedia("print").matches) done(); },1500); },150);
}
let XLSX_P=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(); if(!XLSX_P) XLSX_P=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="lib/xlsx.full.min.js"; s.onload=res; s.onerror=()=>{ XLSX_P=null; rej(); }; document.head.appendChild(s); }); return XLSX_P; }

  try{ await loadXLSX(); }catch(e){ return toast("לא הצלחתי לטעון את רכיב ה-Excel. נסו שוב."); }
  const ot=S.cfg.overtime!==false, wb=XLSX.utils.book_new(), used=new Set();
  const sheetName=n=>{ let b=String(n).replace(/[\\\/\?\*\[\]:]/g,"").slice(0,28)||"עובד", s=b, i=2; while(used.has(s)) s=b.slice(0,25)+" "+(i++); used.add(s); return s; };
  const h2=m=>Math.round(m/60*100)/100;
  if(withSummary){
    const head=["שם","מס׳ עובד","ימי עבודה","סה״כ שעות",...(ot?["רגילות","נוספות 125%","נוספות 150%"]:[]),"ימי חופש","ימי מחלה"];
    const aoa=[[`${S.cfg.company||""} – סיכום נוכחות ${ymLabel(ym)}`],[],head];
    packs.forEach(p=>{ const s=monthSummary(p.list); aoa.push([p.user.name,p.user.emp_no||"",s.days,h2(s.min),...(ot?[h2(s.reg),h2(s.o1),h2(s.o2)]:[]),s.vac,s.sick]); });
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=head.map((_,i)=>({wch:i===0?24:13})); XLSX.utils.book_append_sheet(wb,ws,sheetName("סיכום"));
  }
  packs.forEach(p=>{
    const rows=reportRows(p.list,ym), s=monthSummary(p.list);
    const head=["תאריך","יום","סוג","כניסה","יציאה","הפסקה (דק׳)","סה״כ שעות",...(ot?["רגילות","125%","150%"]:[]),"הערה"];
    const aoa=[[`${S.cfg.company||""} – דוח נוכחות חודשי`],[`עובד/ת: ${p.user.name}`,"",`מס׳ עובד: ${p.user.emp_no||"—"}`,"",`חודש: ${ymLabel(ym)}`],[],head];
    rows.forEach(r=>{ const e=r.e, w=e&&e.kind==="work"; aoa.push([`${pad(r.d)}/${ym.slice(5)}/${ym.slice(0,4)}`,HEB_DAYS[r.dow],e?KIND_HE[e.kind]:"",w?hhmm(e.start_time):"",w?hhmm(e.end_time):"",w?e.break_min:"",w?h2(r.m):"",...(ot?[w?h2(r.o.reg):"",w?h2(r.o.o1):"",w?h2(r.o.o2):""]:[]),e?e.note:""]); });
    aoa.push([]); aoa.push(["סיכום","","ימי עבודה",s.days,"","סה״כ שעות",h2(s.min),...(ot?[h2(s.reg),h2(s.o1),h2(s.o2)]:[])]); aoa.push(["","","ימי חופש",s.vac,"","ימי מחלה",s.sick]);
    const ws=XLSX.utils.aoa_to_sheet(aoa); ws["!cols"]=head.map((h,i)=>({wch:i===head.length-1?30:i===0?12:10}));
    XLSX.utils.book_append_sheet(wb,ws,sheetName(p.user.name));
  });
  wb.Workbook={Views:[{RTL:true}]};
  XLSX.writeFile(wb,(packs.length===1&&!withSummary?fileBase(packs[0].user,ym):`דוחות נוכחות - ${ym}`)+".xlsx");
}

/* ========================== boot ========================== */
(async()=>{
  try{
    const cfg=await (await fetch("/api/config")).json();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase) return renderSetupNeeded();
    S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,storageKey:"lirad.sb",autoRefreshToken:true}});
  }catch(e){ return renderSetupNeeded(); }
  await loadCfg();
  const {data:{session}}=await S.sb.auth.getSession();
  if(session) return enter(null);
  try{ const h=await (await fetch("/api/admin")).json(); if(h.needsSetup) return renderFirstRun(); }catch(e){}
  renderLogin();
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.me&&!$(".modal")) refresh(); });
</script>
</body>
