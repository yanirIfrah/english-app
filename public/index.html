<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>לומדים אנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --line:#e2e8f0; --line-2:#cbd5e1;
  --primary:#4f46e5; --primary-d:#4338ca; --primary-soft:#eef2ff; --ok:#059669; --ok-soft:#ecfdf5; --bad:#dc2626; --bad-soft:#fef2f2;
  --amber:#d97706; --amber-soft:#fffbeb; --radius:14px; --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.04);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:16px}
.wrap{max-width:880px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.drawer{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
html,body{overflow-x:hidden}
.card{overflow-wrap:anywhere}
.hist{table-layout:auto}
.en{direction:ltr;unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
svg.ic{display:inline-block;vertical-align:middle;flex-shrink:0}
/* app bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;font-family:Georgia,serif}
.menu-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2)}
.menu-btn:hover{background:var(--bg)}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.pill svg{color:var(--amber)}
.userchip{display:flex;align-items:center;gap:8px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;transition:background .15s,transform .05s;white-space:nowrap}
.btn:hover{background:var(--primary-d)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)} .btn.ghost:hover{background:var(--bg)}
.btn.ok{background:var(--ok)} .btn.ok:hover{background:#047857}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #fecaca}
.btn.sm{padding:7px 12px;font-size:14px;white-space:normal;text-align:center}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{color:var(--primary);font-size:14px;font-weight:500;padding:2px}
.link:hover{text-decoration:underline}
.link.muted{color:var(--muted)} .link.danger{color:var(--bad)}
/* cards */
.card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--line);box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:24px 0 10px}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hero h2{font-size:22px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.badge{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--primary-soft);color:var(--primary)}
.badge.sun{background:var(--amber-soft);color:var(--amber)} .badge.gray{background:var(--bg);color:var(--ink-2);border:1px solid var(--line)}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:var(--primary);border-radius:999px;transition:width .4s}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:22px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}
.acts{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.act{display:flex;gap:14px;align-items:center;cursor:pointer;padding:16px;transition:border-color .15s,box-shadow .15s}
.act:hover{border-color:var(--line-2);box-shadow:0 4px 20px rgba(15,23,42,.07)}
.act .tile-ic,.tile-ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--primary-soft);color:var(--primary)}
.act h3{font-size:16px;font-weight:600}
.act p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.banner{margin-top:12px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;padding:16px 18px}
.banner .t{font-weight:600;font-size:16px;display:flex;align-items:center;gap:10px}
.banner .s{color:var(--muted);font-size:14px;margin-top:2px}
/* activity screens */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bar .progress{flex:1;margin:0;height:8px}
.x{background:#fff;border:1px solid var(--line);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.stage{text-align:center;padding:28px 20px}
.big-emoji{font-size:84px;line-height:1.1}
.word{font-size:40px;font-weight:700;margin:10px 0;letter-spacing:-.01em}
.word.sm{font-size:28px}
.he{font-size:20px;color:var(--muted);font-weight:500}
.speak-row{display:flex;gap:8px;justify-content:center;align-items:center;margin:10px 0}
.speak{background:var(--primary-soft);color:var(--primary);border-radius:999px;height:48px;padding:0 18px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:transform .1s}
.speak:active{transform:scale(.96)}
.speak.slow{background:#fff;border:1px solid var(--line);color:var(--ink-2);height:40px;padding:0 14px;font-size:14px}
.speak.xl{height:84px;width:84px;padding:0;justify-content:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;font-size:18px;font-weight:600;color:var(--ink);min-height:60px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line-2);background:#fafbfc}
.opt .e{font-size:36px;display:block}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:#065f46}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#991b1b}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.feedback{min-height:30px;margin-top:16px;font-size:18px;font-weight:600}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.flip{perspective:1000px;cursor:pointer;margin:0 auto;max-width:420px}
.flip-inner{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:280px}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:var(--radius);background:#fff;border:1.5px solid var(--line);padding:20px}
.face.back{transform:rotateY(180deg);background:#fafbff}
.hint{color:var(--muted);font-size:13.5px;margin-top:10px}
.nav{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px;direction:ltr}
.tile{background:#fff;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:9px 15px;font-size:20px;font-weight:600;color:var(--ink);min-width:46px}
.tile.used{visibility:hidden}
.answer{min-height:64px;border-bottom:1.5px dashed var(--line-2);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;direction:ltr;align-items:center}
.answer .tile{border-color:#c7d2fe;background:var(--primary-soft)}
input.type{font-family:inherit;font-size:28px;font-weight:600;text-align:center;border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%;max-width:380px;direction:ltr;outline:none}
input.type:focus,input.field:focus,select.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.passage{text-align:left;direction:ltr;font-size:18px;line-height:1.75;background:#fafbfc;border-radius:12px;padding:16px 18px;border:1px solid var(--line)}
.passage .w{cursor:pointer;border-radius:4px} .passage .w:hover{background:#fef3c7}
.q{font-size:20px;font-weight:600;margin:6px 0 4px}
.options.one{grid-template-columns:1fr}
.result{text-align:center;padding:36px 22px}
.result-ic{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:var(--amber-soft);color:var(--amber)}
.result-ic.ok{background:var(--ok-soft);color:var(--ok)} .result-ic.bad{background:var(--bad-soft);color:var(--bad)}
.result h2{font-size:26px;margin:8px 0}
.stars{font-size:30px;letter-spacing:6px;color:var(--amber)}
.big-score{font-size:60px;font-weight:800;letter-spacing:-.02em}
/* forms & modal */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;z-index:30}
.modal .card{width:100%;max-width:520px;max-height:92vh;overflow:auto}
label.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--ink-2)}
input.field,select.field,textarea.field{font-family:inherit;font-size:16px;width:100%;resize:vertical;padding:11px 13px;border-radius:10px;border:1px solid var(--line-2);outline:none;background:#fff;color:var(--ink)}
.pw-wrap{position:relative} .pw-wrap .field{padding-left:44px}
.pw-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.choices{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.choice{text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.choice b{display:block;font-size:15px}
.choice span{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.choice.sel{border-color:var(--primary);background:var(--primary-soft)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:14px;font-weight:500;margin-top:10px;min-height:20px}
.okmsg{color:var(--ok);font-size:14px;font-weight:500;margin-top:10px}
.divider{height:1px;background:var(--line);margin:20px 0}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin-top:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--primary)}
/* auth */
.auth{min-height:calc(100vh - 120px);display:grid;place-items:center}
.auth .card{width:100%;max-width:420px;padding:28px}
.auth h1{font-size:24px;margin:16px 0 4px}
.auth .sub{color:var(--muted);margin:0 0 6px;font-size:15px}
.auth.wide .card{max-width:600px}
/* avatars */
.av{border-radius:50%;overflow:hidden;display:inline-block;flex-shrink:0;background:var(--bg);line-height:0}
.av-emoji{display:inline-grid;place-items:center;border-radius:50%;background:var(--bg);flex-shrink:0}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{flex:1;padding:8px 6px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.08)}
.av-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.av-opt{border:2px solid transparent;border-radius:50%;padding:2px;transition:border-color .15s,transform .1s;aspect-ratio:1}
.av-opt:hover{transform:scale(1.04)}
.av-opt.sel{border-color:var(--primary)}
.av-opt .av{width:100%!important;height:100%!important}
.av-opt svg{width:100%;height:100%}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.97);opacity:.6}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:20;opacity:0;transition:opacity .25s}
.drawer{position:fixed;top:0;bottom:0;right:0;width:300px;max-width:86vw;background:#fff;z-index:21;border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)} .overlay.open{opacity:1}
.d-head{padding:18px 16px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:relative}
.d-head .nm{font-weight:700;font-size:16px}
.d-head .sub{color:var(--muted);font-size:13px;margin-top:1px}
.d-close{position:absolute;top:12px;left:10px;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.d-close:hover{background:var(--bg)}
.d-sec{padding:8px}
.d-title{font-size:12px;font-weight:600;color:var(--muted);padding:10px 10px 6px;letter-spacing:.03em}
.d-item{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:9px 10px;border-radius:9px;font-size:15px;color:var(--ink-2);font-weight:500}
.d-item:hover{background:var(--bg)}
.d-item .i{width:22px;display:grid;place-items:center;color:var(--muted)}
.d-item .lock{margin-inline-start:auto;color:var(--muted);display:grid}
.d-item.active{background:var(--primary-soft);color:var(--primary)} .d-item.active .i{color:var(--primary)}
.d-item small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.d-item.locked{opacity:.55}
.d-sep{height:1px;background:var(--line);margin:4px 12px}
/* tests */
.test-card{display:flex;gap:14px;align-items:center;padding:16px}
.test-card.locked{background:#fafbfc}
.test-card.locked .tile-ic{background:var(--bg);color:var(--muted)}
.test-card .info{flex:1;min-width:0}
.test-card h3{font-size:16px;font-weight:600}
.test-card p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.score-chip{font-weight:700;font-size:13px;padding:3px 9px;border-radius:6px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.score-chip.low{background:var(--bad-soft);color:var(--bad)}
.review{text-align:right;margin-top:20px}
.review .r{padding:10px 12px;border-radius:10px;background:#fafbfc;border:1px solid var(--line);margin-bottom:8px;font-size:14.5px}
.review .r b{color:var(--ok)}
.hist{width:100%;border-collapse:collapse;font-size:14.5px}
.hist td{padding:10px 6px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:none}
/* upload */
.src-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.src{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:14.5px;color:var(--ink-2);text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.src:hover{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.src small{font-weight:400;color:var(--muted);font-size:12px}
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:18px;margin-top:12px;text-align:center;color:var(--muted);font-size:14px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:rgba(15,23,42,.7);color:#fff;display:grid;place-items:center}
.thumb .n{position:absolute;bottom:4px;right:4px;background:rgba(15,23,42,.7);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
.filebox{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbfc}
.filebox .nm{font-weight:600;word-break:break-all}
.upl-status{margin-top:14px;font-size:15px;min-height:22px;color:var(--ink-2)}
.upl-status.bad{color:var(--bad);font-weight:500}
.spin{display:inline-block;width:15px;height:15px;border:2px solid #c7d2fe;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-inline-end:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.step{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:#fff;color:var(--ink-2);font-weight:700;font-size:13px;flex-shrink:0;display:grid;place-items:center}
.step.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done b{text-decoration:line-through;color:var(--muted)}
.tbl-acc{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl-acc td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tr-btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:6px 10px;margin-top:10px}
.tr-btn:hover{background:#e0e7ff}
.tr-out{margin-top:8px;padding:10px 12px;border-radius:10px;background:#fafbfc;border:1px solid var(--line);color:var(--ink-2);font-size:15.5px;line-height:1.6;text-align:right;white-space:pre-line}
.tr-pop{position:absolute;z-index:40;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;box-shadow:0 8px 24px rgba(15,23,42,.25);display:flex;flex-direction:column;align-items:center;gap:2px;max-width:260px;text-align:center;pointer-events:auto}
.tr-pop b{font-size:13px;opacity:.75;font-weight:600}
.tr-pop .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff;margin:0}
.lines .w{cursor:pointer;border-radius:4px} .lines .w:hover{background:#fef3c7}
.line{padding:12px 0;border-bottom:1px solid var(--line)} .line:last-child{border-bottom:none}
.mem{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .mem:last-child{border-bottom:none}
.gbar{display:grid;gap:6px;margin-bottom:12px} .gp{display:flex;align-items:center;gap:8px} .gp .progress{flex:1;margin:0;height:8px} .gp b{min-width:22px;text-align:center}
.reacts{display:flex;justify-content:center;gap:8px;margin-top:12px} .reacts button{font-size:22px;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line)}
.float-emoji{position:fixed;bottom:80px;font-size:44px;z-index:50;animation:floatup 1.6s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-260px);opacity:0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14.5px;box-shadow:0 8px 24px rgba(15,23,42,.25);max-width:90vw;text-align:center}

<script>
/* ===== WEB EDITION bootstrap: Supabase client + adapters that stand in for Claude-hosted capabilities ===== */
(function(){
  let resolveReady; window.__webReady=new Promise(r=>resolveReady=r);
  window.WEB={sb:null,cfg:{},claude:false,peer:Math.random().toString(36).slice(2,12)};
  (async()=>{
    try{
      const r=await fetch("/api/config",{cache:"no-store"}); const c=await r.json(); WEB.cfg=c; WEB.claude=!!c.claude;
      if(c.supabaseUrl&&c.supabaseAnonKey&&window.supabase) WEB.sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,storageKey:"englishApp.sb",autoRefreshToken:true}});
    }catch(e){ console.warn("config",e); }
    resolveReady();
  })();

  /* ---- online room over Supabase Realtime presence (same shape the app already uses) ---- */
  function makeRoomNS(){
    const PEER=WEB.peer;
    return {
      join: async(name)=>{
        const sb=WEB.sb; if(!sb) throw {code:"not_permitted"};
        const ch=sb.channel("room:"+name,{config:{presence:{key:PEER}}});
        let me={}; const hs=new Set(); const seen={}; let last=[];
        const snap=()=>{
          const st=ch.presenceState(); const arr=[];
          for(const k in st){ const metas=st[k]; const m=metas[metas.length-1]||{}; const pres=m.p||{}; const js=JSON.stringify(pres);
            if(!seen[k]||seen[k].js!==js) seen[k]={js,at:Date.now()};
            arr.push(Object.freeze({peer:k,by:null,isMe:k===PEER,sameTab:k===PEER,kind:"viewer",guest:false,presence:pres,updatedAt:seen[k].at})); }
          if(!arr.some(x=>x.isMe)) arr.push(Object.freeze({peer:PEER,by:null,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:me,updatedAt:Date.now()}));
          last=Object.freeze(arr); return last;
        };
        const fire=()=>{ const ps=snap(); hs.forEach(h=>{ try{ h({peers:ps,joined:[],left:[],updated:[]}); }catch(e){ console.error(e); } }); };
        ch.on("presence",{event:"sync"},fire).on("presence",{event:"join"},fire).on("presence",{event:"leave"},fire);
        await new Promise((res,rej)=>{ const t=setTimeout(()=>rej({code:"upstream_error"}),10000); ch.subscribe(s=>{ if(s==="SUBSCRIBED"){ clearTimeout(t); res(); } else if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){ clearTimeout(t); rej({code:"upstream_error"}); } }); });
        return {
          name,
          presence: async patch=>{ me={...me}; for(const k in patch){ if(patch[k]===null) delete me[k]; else me[k]=patch[k]; } try{ await ch.track({p:me}); }catch(e){} fire(); },
          onPeers: h=>{ hs.add(h); setTimeout(()=>{ const ps=snap(); h({peers:ps,joined:ps,left:[],updated:[]}); },0); return ()=>hs.delete(h); },
          peers: ()=>last.length?last:snap(),
          leave: async()=>{ hs.clear(); try{ await ch.untrack(); }catch(e){} try{ await sb.removeChannel(ch); }catch(e){} },
          connected: ()=>true, onConnection: h=>{ setTimeout(()=>h(true),0); return ()=>{}; },
          emit: async()=>{}, on: ()=>()=>{}
        };
      },
      peers:()=>[], onPeers:()=>()=>{}, presence:async()=>{}, connected:()=>true
    };
  }

  /* ---- Claude through /api/claude (only when the site owner configured an API key) ---- */
  async function shrink(blob){
    try{
      const url=URL.createObjectURL(blob); const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const s=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      const out=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
      const data=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(out); });
      return {type:"image/jpeg",data};
    }catch(e){ throw {code:"image_rejected"}; }
  }
  function parseLoose(t){
    try{ return JSON.parse(t); }catch(e){}
    const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch(e){} }
    const a=t.search(/[\[{]/), b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
    if(a>=0&&b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
    throw {code:"invalid_json",text:t};
  }
  function makeSample(){
    const call=async(input,opts={})=>{
      const list=opts.images?(opts.images instanceof Blob?[opts.images]:[...opts.images]):[];
      const images=[]; for(const b of list.slice(0,5)) images.push(await shrink(b));
      const {data}=await WEB.sb.auth.getSession(); const tok=data&&data.session&&data.session.access_token;
      if(!tok) throw {code:"not_granted"};
      let r; try{ r=await fetch("/api/claude",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tok},body:JSON.stringify({input,images,tier:opts.modelTier||"default"}),signal:opts.signal}); }
      catch(e){ throw e&&e.name==="AbortError"?{code:"cancelled"}:{code:"upstream_error"}; }
      if(!r.ok) throw {code:r.status===429?"rate_limited":r.status===401?"session_expired":r.status===503?"sampling_disabled":"upstream_error"};
      const j=await r.json(); if(opts.onText) try{ opts.onText({text:j.text,delta:j.text}); }catch(e){}
      if(!j.text) throw {code:"empty_completion"};
      return {text:j.text,truncated:!!j.truncated};
    };
    const f=(i,o)=>call(i,o);
    f.json=async(i,o)=>{ const {text}=await call(typeof i==="string"?i+"\n\n(Reply with valid JSON only.)":i,o); return parseLoose(text); };
    f.limits=async()=>({maxPromptBytes:262144,images:{maxCount:5,maxInputBytes:25e6,mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}});
    return f;
  }

  window.claude={use: async name=>{
    await window.__webReady;
    if(name==="room") return WEB.sb?makeRoomNS():null;
    if(name==="sample") return WEB.sb&&WEB.claude?makeSample():null;
    return null; // db / user: replaced by Supabase tables in this edition
  }};
})();

</script>

   qs:[{q:"How did most students feel at the beginning?",he:"איך רוב התלמידים הרגישו בהתחלה?",opts:["Excited","Worried","Bored"],a:1},{q:"When did things start to change for the writer?",he:"מתי דברים התחילו להשתנות לכותב/ת?",opts:["On the first day","By Wednesday","After the week"],a:1},{q:"What does \"I kept reaching for my pocket\" suggest?",he:"מה המשפט על הכיס מרמז?",opts:["The writer lost money","The writer missed the phone","The writer was cold"],a:1},{q:"What was the final result?",he:"מה הייתה המסקנה בסוף?",opts:["Everyone gave up phones forever","Nobody learned anything","Most wanted to use screens less"],a:2}]},
  {title:"Learning the Guitar",text:"When Omer turned thirteen, his grandfather gave him an old guitar. Omer had never played an instrument, and his fingers hurt after only ten minutes. He almost gave up. Then his grandfather told him a secret: \"Practice a little every day, not a lot once a week.\" Omer decided to practice for fifteen minutes every evening. Three months later, he played a full song for his family. Now he is confident enough to play at the school talent show, and he is looking forward to it.",
   qs:[{q:"Who gave Omer the guitar?",he:"מי נתן לעומר את הגיטרה?",opts:["His teacher","His father","His grandfather"],a:2},{q:"What was the grandfather's advice?",he:"מה הייתה העצה של הסבא?",opts:["Practice a little every day","Take lessons","Buy a new guitar"],a:0},{q:"What happened after three months?",he:"מה קרה אחרי שלושה חודשים?",opts:["He gave up","He played a full song","He broke the guitar"],a:1},{q:"How does Omer feel about the talent show?",he:"איך עומר מרגיש לגבי מופע הכישרונות?",opts:["Scared","Excited about it","Angry"],a:1}]}],

 reading:[{title:"Are Teens Really Addicted to Social Media?",text:"Many adults assume that teenagers are addicted to social media, and there is some evidence to support this concern. Studies suggest that heavy use can affect sleep and concentration. Nevertheless, the picture is more complicated than it first appears. For many teens, online platforms are a way to stay connected with friends, explore creative interests, and find communities they cannot find locally. Researchers increasingly argue that the significant question is not how much time teens spend online, but how they spend it. Passive scrolling tends to leave people feeling worse, whereas actively creating content or messaging close friends may have neutral or even positive effects. Rather than banning phones, some experts encourage families to discuss healthy habits together, so that teens learn to cope with the overwhelming flow of information on their own.",
   qs:[{q:"What is the main idea of the text?",he:"מהו הרעיון המרכזי?",opts:["Social media should be banned","The effect depends on how social media is used","Teens never use social media"],a:1},{q:"The word \"Nevertheless\" introduces…",he:"המילה Nevertheless מציגה…",opts:["a contrasting idea","an example","a conclusion"],a:0},{q:"According to the text, passive scrolling…",he:"לפי הטקסט, גלילה פסיבית…",opts:["improves concentration","tends to make people feel worse","is the same as messaging friends"],a:1},{q:"What do some experts recommend?",he:"מה ממליצים חלק מהמומחים?",opts:["Taking phones away","Family discussions about habits","More screen time"],a:1}]},
  {title:"The Four-Day School Week",text:"In several countries, schools have experimented with a four-day week. Supporters claim that the extra day off allows students to rest, pursue hobbies, and return to class more motivated. Teachers, meanwhile, report having more time to plan lessons. Critics, however, are reluctant to embrace the idea. They point out that longer school days can be exhausting, especially for younger children, and that working parents may struggle to find childcare on the free day. Early results are mixed: some schools saw attendance improve, while others noticed a slight drop in test scores. It seems inevitable that the debate will continue until more reliable data is available.",
   qs:[{q:"Which is an argument FOR the four-day week?",he:"איזה טיעון בעד שבוע לימודים של 4 ימים?",opts:["Students return more motivated","Parents need childcare","Test scores dropped"],a:0},{q:"Why might working parents dislike the idea?",he:"למה הורים עובדים עלולים להתנגד?",opts:["Schools are too expensive","They need childcare on the free day","Teachers plan less"],a:1},{q:"\"Reluctant to embrace\" most nearly means…",he:"\"Reluctant to embrace\" פירושו בערך…",opts:["eager to accept","unwilling to accept","unable to understand"],a:1},{q:"What is the writer's conclusion?",he:"מה מסקנת הכותב?",opts:["The idea clearly works","The idea clearly fails","More data is needed"],a:2}]}],

function trS(s,depth=0){

const skipEl=el=>!el||el.closest("script,style,[data-notr]");

function trTree(root){

const hex = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
function newSalt(){ const a=new Uint8Array(16); (crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0)); return hex(a); }
async function hashPw(pw,salt){
  try{
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return "p2:"+hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(salt),iterations:120000},k,256));
  }catch(e){ // fallback without WebCrypto
    let h=2166136261; const s=salt+"|"+pw; for(let r=0;r<20000;r++) for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i)+r; h=Math.imul(h,16777619)>>>0; }
    return "f1:"+h.toString(16);
  }
}

  try{

let actx=null;
function tone(ok){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = ok ? [660,880] : [300,220];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const t=actx.currentTime+i*0.12; g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.22);
    });
  }catch(e){}
}

/* ---------- controls, usage, activity log ---------- */
function defaultCtrl(){ return {acts:{},upload:true,scan:true,trTests:true,selfLevel:true,limitMin:0,quick:false,community:true}; }
function rawCtrl(p){ p.ctrl=Object.assign(defaultCtrl(),p.ctrl||{}); p.ctrl.acts=p.ctrl.acts||{}; return p.ctrl; }
function ctrlOf(p){ const c=rawCtrl(p), G=(typeof CLOUD!=="undefined"&&CLOUD.cfg)||{}; return {...c,acts:c.acts,upload:c.upload&&G.upload!==false,scan:c.scan&&G.scan!==false,community:c.community&&G.community!==false,limitMin:(+c.limitMin||0)||(+G.limitMin||0)}; }
function availActs(p){
  const c=content(p), G=group(p), A=ctrlOf(p).acts;
  return ACTIVITIES.filter(a=>A[a.id]!==false && (G!=="tod"||["cards","listen","quiz"].includes(a.id)) && (a.id!=="build"||c.sentences.length) && (a.id!=="read"||c.reading.length) && (a.id!=="grammar"||c.grammar.length));
}
const dayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const minsOn=(p,k)=>Math.round(((p.usage||{})[k]||0)/60);
function overLimit(p){ const L=+ctrlOf(p).limitMin||0; return L>0 && minsOn(p,dayKey())>=L; }
function blockedByLimit(){ const p=cur(); if(p&&overLimit(p)){ renderLimit(); return true; } return false; }
function renderLimit(){
  PLAN=null; const p=cur();
  app.innerHTML=topBar()+`<div class="auth"><div class="card pop" style="text-align:center"><div class="result-ic">${icon("lock",36)}</div><h1>זמן הלמידה להיום הסתיים</h1><p class="sub">ההגבלה היא ${ctrlOf(p).limitMin} דקות ביום. נתראה מחר!</p><div class="nav"><button class="btn" id="lo">${icon("logout",16)} התנתקות</button></div></div></div>`;
  $("#lo").onclick=()=>renderLogin();
}
setInterval(()=>{
  const p=cur(); if(!p||document.visibilityState!=="visible") return;
  p.usage=p.usage||{}; const k=dayKey(); p.usage[k]=(p.usage[k]||0)+15; p.lastSeen=Date.now();
  const ks=Object.keys(p.usage).sort(); if(ks.length>90) ks.slice(0,ks.length-90).forEach(x=>delete p.usage[x]);
  save(); if(overLimit(p) && !document.querySelector(".auth")){ closeDrawer(); $("#modal-root").innerHTML=""; renderLimit(); }
},15000);
function logEvent(p,type,text){ if(!p) return; p.log=p.log||[]; p.log.push({t:Date.now(),type,text}); if(p.log.length>300) p.log.splice(0,p.log.length-300); save(); }
function trackLabel(p,key){
  if(key.startsWith("plan_")){ const pl=(p.plans||[]).find(x=>"plan_"+x.id===key); return pl?`תוכנית: ${pl.data.title}`:"תוכנית שנמחקה"; }
  const m=key.match(/^(tod|kid|teen|adult)(\d)$/); return m?`${GROUP_NAME[m[1]]} · ${LEVELS[+m[2]-1].name}`:key;
}
function trackContent(p,key){ if(key.startsWith("plan_")){ const pl=(p.plans||[]).find(x=>"plan_"+x.id===key); return pl&&pl.data; } return CONTENT[key]; }
function knownFor(p,key){ const c=trackContent(p,key); if(!c) return [0,0]; const w=((p.progress||{})[key]||{}).words||{}; return [c.vocab.filter(v=>(w[v[0]]||0)>=2).length,c.vocab.length]; }
const homeKey=p=>group(p)+p.level;
const passedFor=(p,key)=>Object.values((p.tests||{})[key]||{}).filter(t=>t.best>=70).length;
const fmtDT=t=>new Date(t).toLocaleString(LOC(),{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});

  const sg=$("#sc-go"); if(sg) sg.onclick=()=>renderScan();
  const cg=$("#cm-go"); if(cg) cg.onclick=renderCommunity;
  if(typeof ensureLobby==="function") ensureLobby();
}

let S=null; // session
function frame(inner){
  const pct = S.total ? Math.round(S.i/S.total*100) : 0;
  app.innerHTML = `<div class="bar"><button class="x" id="quit" aria-label="יציאה">${icon("close",18)}</button><div class="progress"><div style="width:${pct}%"></div></div><span class="pill">${icon("star",15)} ${S.score}</span></div>
    <div class="card stage" id="stage">${inner}</div>`;
  $("#quit").onclick=()=>{ S=null; backHome(); };
}
function speakBtns(text){
  return `<div class="speak-row"><button class="speak" data-say="${esc(text)}" aria-label="השמעה">${icon("sound",20)} השמעה</button><button class="speak slow" data-say="${esc(text)}" data-slow="1" aria-label="השמעה איטית">איטי</button></div>`;
}
function wireSpeak(){ app.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();say(b.dataset.say,!!b.dataset.slow);}); }
function correct(extraPts=1){ S.score+=extraPts; tone(true); }
function nextFor(sess){ return ()=>{ if(S===sess) next(); }; }
function next(){ if(!S||!document.getElementById("stage")) return; S.i++; if(S.i>=S.total) finish(); else S.render(); }
function finish(){
  const p=cur(); p.stars=(p.stars||0)+S.score; save();
  logEvent(p,"activity",`${(ACTIVITIES.find(a=>a.id===S.type)||{t:S.type}).t}${S.maxScore?`: ${S.score}/${S.maxScore}`:""}${PLAN?` · ${PLAN.data.title}`:""}`);
  const ratio = S.maxScore ? S.score/S.maxScore : 1;
  const st = ratio>=0.9?3:ratio>=0.6?2:ratio>0?1:0;
  const msg = st===3?g("מושלם! את אלופה 🏆","מושלם! אתה אלוף 🏆"):st===2?"עבודה טובה מאוד! 💪":st===1?"יפה! עוד קצת תרגול ותשלטו 🌱":"לא נורא, ננסה שוב 💛";
  app.innerHTML = `<div class="card result pop">
    <div class="result-ic ${st>=2?"ok":""}">${icon(st===3?"trophy":"star",38)}</div>
    <h2>${msg}</h2>
    ${S.maxScore?`<div class="stars">${"★".repeat(st)}<span style="color:var(--line-2)">${"★".repeat(3-st)}</span></div><p style="font-size:18px;color:var(--ink-2)">צברת <b>${S.score}</b> כוכבים</p>`:`<p style="font-size:18px;color:var(--ink-2)">עברת על ${S.total} מילים. עכשיו נסו את החידון!</p>`}
    <div class="nav"><button class="btn" id="again">שוב!</button><button class="btn ghost" id="home">לתפריט</button></div>
  </div>`;
  $("#again").onclick=()=>startActivity(S.type);
  $("#home").onclick=backHome;
}
function lockOptions(btns, rightIdx, chosenIdx){
  btns.forEach((b,i)=>{ b.disabled=true; if(i===rightIdx) b.classList.add("right"); else if(i===chosenIdx) b.classList.add("wrong"); });
}

function startActivity(type){
  const p=cur(), c=content(p), G=group(p), tod=G==="tod", kid=G==="kid"||tod;
  if(blockedByLimit()) return;
  S={type,i:0,score:0,total:0,maxScore:0};

  /* ---- Flashcards ---- */
  if(type==="cards"){
    const words=practiceWords(p,8); S.total=words.length;
    S.render=()=>{
      const [en,he,em]=words[S.i];
      frame(`<div class="flip" id="flip"><div class="flip-inner">
          <div class="face"><div class="big-emoji">${em}</div><div class="word en">${esc(en)}</div><div class="hint">לחצו על הכרטיס לתרגום</div></div>
          <div class="face back"><div class="big-emoji">${em}</div><div class="word en sm">${esc(en)}</div><div class="he">${esc(he)}</div></div>
        </div></div>
        ${speakBtns(en)}
        <div class="nav">${S.i>0?`<button class="btn ghost" id="prev">→ הקודם</button>`:""}<button class="btn" id="nx">${S.i===S.total-1?"סיום ✓":"הבא ←"}</button></div>`);
      wireSpeak(); say(en);
      $("#flip").onclick=()=>$("#flip").classList.toggle("on");
      $("#nx").onclick=next;
      const pv=$("#prev"); if(pv) pv.onclick=()=>{S.i--;S.render();};
    };
    return S.render();
  }

  /* ---- Word quiz ---- */
  if(type==="quiz"){
    const words=practiceWords(p,10); S.total=S.maxScore=words.length;
    S.render=()=>{
      const w=words[S.i], mode = tod ? "tod" : kid ? (w[2]&&!["🔤","📌"].includes(w[2])?["en2he","emoji2en","en2he"][S.i%3]:"en2he") : ["en2he","he2en"][S.i%2];
      const opts=shuffle([w,...pick(c.vocab.filter(v=>v!==w),tod?1:3)]), right=opts.indexOf(w);
      let prompt, label;
      if(mode==="en2he"){ prompt=`<div class="big-emoji" style="font-size:60px">${kid?w[2]:"🤔"}</div><div class="word en">${esc(w[0])}</div>${speakBtns(w[0])}<div class="he">מה הפירוש?</div>`; label=o=>esc(o[1]); }
      else if(mode==="he2en"){ prompt=`<div class="he" style="font-size:16px">איך אומרים באנגלית:</div><div class="word">${esc(w[1])}</div>`; label=o=>`<span class="en">${esc(o[0])}</span>`; }
      else if(mode==="tod"){ prompt=`<div class="he">איפה…?</div><div class="word en">${esc(w[0])}</div>${speakBtns(w[0])}`; label=o=>`<span class="e" style="font-size:72px">${o[2]}</span>`; }
      else { prompt=`<div class="big-emoji">${w[2]}</div><div class="he">איך אומרים באנגלית?</div>`; label=o=>`<span class="en">${esc(o[0])}</span>`; }
      frame(`${prompt}<div class="options">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${label(o)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`);
      wireSpeak(); if(mode==="en2he"||mode==="tod") say(w[0]);
      const btns=[...app.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, ok=i===right; lockOptions(btns,right,i); markWord(p,w[0],ok); save();
        const fb=$("#fb");
        if(ok){ correct(); fb.className="feedback ok pop"; fb.textContent=praise(); }
        else { tone(false); fb.className="feedback bad"; fb.innerHTML=`התשובה: <span class="en">${esc(w[0])}</span> = ${esc(w[1])}`; $("#stage").classList.add("shake"); }
        say(w[0]); setTimeout(nextFor(S), ok?1100:2200);
      });
    };
    return S.render();
  }

  /* ---- Listening ---- */
  if(type==="listen"){
    const words=practiceWords(p,10); S.total=S.maxScore=words.length;
    S.render=()=>{
      const w=words[S.i], opts=shuffle([w,...pick(c.vocab.filter(v=>v!==w),tod?2:3)]), right=opts.indexOf(w);
      frame(`<div class="he">הקשיבו ובחרו את מה ששמעתם</div>
        <div class="speak-row" style="margin:16px 0"><button class="speak xl" data-say="${esc(w[0])}" aria-label="השמעה">${icon("sound",36)}</button>
        <button class="speak slow" data-say="${esc(w[0])}" data-slow="1">איטי</button></div>
        <div class="options" ${tod?'style="grid-template-columns:repeat(3,1fr)"':""}>${opts.map((o,i)=>`<button class="opt" data-i="${i}">${tod?`<span class="e" style="font-size:64px">${o[2]}</span>`:`${kid?`<span class="e">${o[2]}</span>`:""}<span class="en">${esc(o[0])}</span>`}</button>`).join("")}</div>
        <div class="feedback" id="fb"></div>`);
      wireSpeak(); setTimeout(()=>say(w[0]),250);
      const btns=[...app.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, ok=i===right; lockOptions(btns,right,i); markWord(p,w[0],ok); save();
        const fb=$("#fb");
        if(ok){ correct(); fb.className="feedback ok pop"; fb.innerHTML=`<span>${praise()}</span> <span>${esc(w[1])}</span>`; }
        else { tone(false); fb.className="feedback bad"; fb.innerHTML=`שמעת: <span class="en">${esc(w[0])}</span> (${esc(w[1])})`; }
        setTimeout(nextFor(S), ok?1200:2200);
      });
    };
    return S.render();
  }

  /* ---- Spelling ---- */
  if(type==="spell"){
    const pool = c.vocab.filter(v=>!kid || !v[0].includes(" "));
    const words=practiceWords({...p},20).filter(v=>pool.includes(v)).slice(0,8); S.total=S.maxScore=words.length;
    S.render=()=>{
      const w=words[S.i], target=w[0];
      const head = `<div class="big-emoji" style="font-size:64px">${w[2]}</div><div class="he">${esc(w[1])}</div>${speakBtns(target)}`;
      if(kid){
        const letters = target.split("");
        const extra = pick("abcdefghijklmnoprstuwy".split("").filter(l=>!letters.includes(l)), Math.min(3,Math.max(2,6-letters.length)));
        const tiles = shuffle([...letters,...extra]).map((l,idx)=>({l,idx}));
        let chosen=[];
        frame(`${head}<div class="answer" id="ans"></div><div class="tiles" id="tiles"></div>
          <div class="nav"><button class="btn ghost" id="clr">מחיקה</button><button class="btn ok" id="chk" disabled>בדיקה</button></div><div class="feedback" id="fb"></div>`);
        wireSpeak(); say(target);
        const draw=()=>{
          $("#tiles").innerHTML=tiles.map(t=>`<button class="tile ${chosen.includes(t.idx)?"used":""}" data-t="${t.idx}">${t.l}</button>`).join("");
          $("#ans").innerHTML=chosen.map(ix=>`<button class="tile" data-c="${ix}">${tiles.find(t=>t.idx===ix).l}</button>`).join("");
          $("#chk").disabled=chosen.length===0;
          app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.t);draw();});
          app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==+b.dataset.c);draw();});
        };
        draw();
        $("#clr").onclick=()=>{chosen=[];draw();};
        $("#chk").onclick=()=>check(chosen.map(ix=>tiles.find(t=>t.idx===ix).l).join(""));
      } else {
        frame(`${head}<div style="margin-top:14px"><input class="type" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here"></div>
          <div class="nav"><button class="btn ghost" id="hint">רמז</button><button class="btn ok" id="chk">בדיקה</button></div><div class="feedback" id="fb"></div>`);
        wireSpeak(); say(target);
        const inp=$("#inp"); inp.focus();
        inp.onkeydown=e=>{ if(e.key==="Enter") check(inp.value); };
        $("#chk").onclick=()=>check(inp.value);
        $("#hint").onclick=()=>{ $("#fb").className="feedback"; $("#fb").innerHTML=`מתחילה ב-<b class="en">${esc(target[0])}</b>, ${target.replace(/ /g,"").length} אותיות`; S.hinted=true; };
      }
      function check(val){
        const ok = val.trim().toLowerCase().replace(/\s+/g," ")===target.toLowerCase();
        const fb=$("#fb"); app.querySelectorAll("#chk,#clr,#hint").forEach(b=>b&&(b.disabled=true));
        markWord(p,target,ok); save();
        if(ok){ correct(); fb.className="feedback ok pop"; fb.textContent=praise(); }
        else { tone(false); fb.className="feedback bad"; fb.innerHTML=`הכתיב הנכון: <b class="en">${esc(target)}</b>`; $("#stage").classList.add("shake"); }
        S.hinted=false; setTimeout(nextFor(S), ok?1100:2400);
      }
    };
    return S.render();
  }

  /* ---- Sentence building ---- */
  if(type==="build"){
    const sents=shuffle(c.sentences).slice(0,6); S.total=S.maxScore=sents.length;
    S.render=()=>{
      const [en,he]=sents[S.i], words=en.split(" ");
      let tiles=shuffle(words.map((w,idx)=>({w,idx}))); if(tiles.map(t=>t.w).join(" ")===en && words.length>1) tiles=tiles.reverse();
      let chosen=[];
      frame(`<div class="he" style="font-size:16px">סדרו את המילים כך שיהיה כתוב:</div>
        <div class="word sm" style="margin:8px 0 14px">${esc(he)}</div>
        <div class="answer" id="ans"></div><div class="tiles" id="tiles"></div>
        <div class="nav"><button class="btn ghost" id="clr">מחיקה</button><button class="btn ok" id="chk" disabled>בדיקה</button></div><div class="feedback" id="fb"></div>`);
      const draw=()=>{
        $("#tiles").innerHTML=tiles.map(t=>`<button class="tile ${chosen.includes(t.idx)?"used":""}" data-t="${t.idx}">${esc(t.w)}</button>`).join("");
        $("#ans").innerHTML=chosen.map(ix=>`<button class="tile" data-c="${ix}">${esc(words[ix])}</button>`).join("");
        $("#chk").disabled=chosen.length!==words.length;
        app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{chosen.push(+b.dataset.t);say(words[+b.dataset.t]);draw();});
        app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{chosen=chosen.filter(x=>x!==+b.dataset.c);draw();});
      };
      draw();
      $("#clr").onclick=()=>{chosen=[];draw();};
      $("#chk").onclick=()=>{
        const ok = chosen.map(ix=>words[ix]).join(" ").toLowerCase()===en.toLowerCase();
        const fb=$("#fb"); $("#chk").disabled=true; $("#clr").disabled=true;
        if(ok){ correct(); fb.className="feedback ok pop"; fb.textContent=praise(); }
        else { tone(false); fb.className="feedback bad"; fb.innerHTML=`המשפט הנכון: <span class="en">${esc(en)}</span>`; $("#stage").classList.add("shake"); }
        say(en); setTimeout(nextFor(S), ok?1800:3200);
      };
    };
    return S.render();
  }

  /* ---- Reading ---- */
  if(type==="read"){
    const story = c.reading[Math.floor(Math.random()*c.reading.length)];
    S.total=story.qs.length+1; S.maxScore=story.qs.length;
    const passageHTML = story.text.split(/(\s+)/).map(t=>/\s+/.test(t)?t:`<span class="w">${esc(t)}</span>`).join("");
    S.render=()=>{
      if(S.i===0){
        frame(`<h2 class="en" style="font-size:26px;margin-bottom:10px">${esc(story.title)}</h2>
          ${speakBtns(story.text)}
          <div class="passage" id="psg">${wrapWords(story.text)}</div>
          <div class="hint">לחצו על מילה כדי לשמוע אותה ולראות תרגום</div>
          ${trBtn(story.text,"תרגום כל הטקסט")}
          <div class="nav"><button class="btn" id="go">לשאלות ←</button></div>`);
        wireSpeak();
        $("#go").onclick=()=>{ try{speechSynthesis.cancel();}catch(e){} next(); };
        return;
      }
      const q=story.qs[S.i-1];
      frame(`<details style="text-align:right;margin-bottom:12px"><summary style="cursor:pointer;color:var(--primary);font-weight:700">להציג שוב את הטקסט</summary><div class="passage" style="margin-top:8px">${esc(story.text)}</div></details>
        <div class="q en">${esc(q.q)}</div>${kid||p.level===1?`<div class="he" style="font-size:16px">${esc(q.he)}</div>`:`<button class="link" id="tr">תרגום השאלה</button><div class="he" id="trq" style="font-size:16px;display:none">${esc(q.he)}</div>`}
        <div class="options one">${q.opts.map((o,i)=>`<button class="opt en" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`);
      const tr=$("#tr"); if(tr) tr.onclick=()=>{$("#trq").style.display="block";tr.remove();};
      const btns=[...app.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, ok=i===q.a; lockOptions(btns,q.a,i);
        const fb=$("#fb");
        if(ok){ correct(); fb.className="feedback ok pop"; fb.textContent=praise(); }
        else { tone(false); fb.className="feedback bad"; fb.textContent="לא בדיוק — התשובה הנכונה מסומנת בירוק"; }
        setTimeout(nextFor(S), ok?1100:2300);
      });
    };
    return S.render();
  }

  /* ---- Grammar ---- */
  if(type==="grammar"){
    const items=shuffle(c.grammar); S.total=S.maxScore=items.length;
    S.render=()=>{
      const g=items[S.i], opts=g.opts.map((o,i)=>({o,i})), sh=shuffle(opts), right=sh.findIndex(x=>x.i===g.a);
      const sentence = esc(g.q).replace("___",`<span id="blank" style="display:inline-block;min-width:80px;border-bottom:3px solid var(--primary);color:var(--primary)">&nbsp;</span>`);
      frame(`<div class="he" style="font-size:16px">השלימו את המשפט</div>
        <div class="word sm en" style="margin:16px 0;line-height:1.5">${sentence}</div>${trBtn(g.q,"תרגום המשפט")}
        <div class="options">${sh.map((x,i)=>`<button class="opt en" data-i="${i}">${esc(x.o)}</button>`).join("")}</div>
        <div class="feedback" id="fb"></div>`);
      const btns=[...app.querySelectorAll(".opt")];
      btns.forEach(b=>b.onclick=()=>{
        const i=+b.dataset.i, ok=i===right; lockOptions(btns,right,i);
        $("#blank").textContent=g.opts[g.a];
        const fb=$("#fb");
        if(ok){ correct(); fb.className="feedback ok pop"; fb.innerHTML=`${praise()}<div style="font-size:16px;color:var(--muted);font-weight:500;margin-top:4px">${esc(g.he)}</div>`; }
        else { tone(false); fb.className="feedback bad"; fb.innerHTML=`💡 ${esc(g.he)}`; }
        say(g.q.replace("___",g.opts[g.a]));
        setTimeout(nextFor(S), ok?1800:3200);
      });
    };
    return S.render();
  }
}

/* question builders: {prompt, opts:[html], a, say, review, word} */
function vocabQ(p,w,kind){
  if(kind==="emoji"&&(!w[2]||["🔤","📌"].includes(w[2]))) kind="en2he";
  const c=content(p), kid=["kid","tod"].includes(group(p));
  if(kind==="tod"){ const o=shuffle([w,...pick(c.vocab.filter(v=>v!==w),2)]); return {prompt:`<div class="he">איפה…?</div><div class="word en">${esc(w[0])}</div>${speakBtns(w[0])}`,opts:o.map(x=>`<span class="e" style="font-size:60px">${x[2]}</span>`),a:o.indexOf(w),say:w[0],review:{en:w[0],he:w[1]},word:w[0],cols:3}; }
  const opts=shuffle([w,...pick(c.vocab.filter(v=>v!==w),3)]), a=opts.indexOf(w);
  const review={en:w[0],he:w[1]};
  if(kind==="he2en") return {prompt:`<div class="he" style="font-size:16px">איך אומרים באנגלית:</div><div class="word">${esc(w[1])}</div>`,opts:opts.map(o=>`<span class="en">${esc(o[0])}</span>`),a,review,word:w[0]};
  if(kind==="listen") return {prompt:`<div class="he">הקשיבו ובחרו את המילה</div><div style="margin:10px 0">${speakBtns(w[0])}</div>`,opts:opts.map(o=>`${kid?`<span class="e">${o[2]}</span>`:""}<span class="en">${esc(o[0])}</span>`),a,say:w[0],review,word:w[0]};
  if(kind==="emoji") return {prompt:`<div class="big-emoji">${w[2]}</div><div class="he">איך אומרים באנגלית?</div>`,opts:opts.map(o=>`<span class="en">${esc(o[0])}</span>`),a,review,word:w[0]};
  return {prompt:`<div class="word en">${esc(w[0])}</div>${speakBtns(w[0])}<div class="he">מה הפירוש?</div>`,opts:opts.map(o=>esc(o[1])),a,review,word:w[0]};
}
function grammarQ(g){
  const sh=shuffle(g.opts.map((o,i)=>({o,i}))), a=sh.findIndex(x=>x.i===g.a);
  return {prompt:`<div class="he" style="font-size:16px">השלימו את המשפט</div><div class="word sm en" style="margin:14px 0;line-height:1.5">${esc(g.q).replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</div>${trAllowed()?trBtn(g.q,"תרגום המשפט"):""}`,
    opts:sh.map(x=>`<span class="en">${esc(x.o)}</span>`),a,review:{en:g.q.replace("___",g.opts[g.a]),he:g.he}};
}
const trAllowed=()=>{ const p=cur(); return !p||ctrlOf(p).trTests!==false; };
function readingQs(p,story){
  const kid=group(p)==="kid";
  return story.qs.map(q=>({
    prompt:`<details ${""} open style="text-align:right;margin-bottom:10px"><summary style="cursor:pointer;color:var(--primary);font-weight:700">${esc(story.title)} – הטקסט</summary><div class="passage" style="margin-top:8px;font-size:16px">${wrapWords(story.text)}</div>${trAllowed()?trBtn(story.text,"תרגום הטקסט"):""}</details>
      <div class="q en">${esc(q.q)}</div>${kid||p.level===1?`<div class="he" style="font-size:15px">${esc(q.he)}</div>`:(trAllowed()?trBtn(q.q+"\n"+q.opts.map((o,i)=>(i+1)+". "+o).join("\n"),"תרגום השאלה והתשובות"):"")}`,
    opts:q.opts.map(o=>`<span class="en">${esc(o)}</span>`),a:q.a,one:true,review:{en:`${q.q} → ${q.opts[q.a]}`,he:q.he}}));
}
function buildTest(p,id){
  const c=content(p), G=group(p), kid=G==="kid", w=prog(p).words;
  const kinds = G==="tod" ? ["tod"] : kid ? ["en2he","emoji","listen","he2en"] : ["en2he","he2en","listen"];
  const vq = (list)=>list.map((v,i)=>vocabQ(p,v,kinds[i%kinds.length]));
  if(id==="words"){
    const known=shuffle(c.vocab.filter(v=>(w[v[0]]||0)>=2));
    const learning=shuffle(c.vocab.filter(v=>(w[v[0]]||0)===1));
    return vq([...known,...learning].slice(0,10));
  }
  if(id==="mid") return shuffle([...vq(pick(c.vocab,7)),...pick(c.grammar,5).map(grammarQ)]);
  const story=c.reading.length ? c.reading[Math.floor(Math.random()*c.reading.length)] : null;
  return [...shuffle([...vq(pick(c.vocab, story?6:10)),...pick(c.grammar,5).map(grammarQ)]),...(story?readingQs(p,story).slice(0,4):[])];
}

function finishTest(){
  const p=cur(), {test,qs,answers}=T;
  let right=0; const wrong=[];
  qs.forEach((q,i)=>{ const ok=answers[i]===q.a; if(ok) right++; else wrong.push({q,i}); if(q.word) markWord(p,q.word,ok); });
  const score=Math.round(right/qs.length*100), passed=score>=test.pass;
  const st=testStore(p); st[test.id]=st[test.id]||{best:0,attempts:[]};
  const isBest = score>st[test.id].best || st[test.id].attempts.length===0;
  st[test.id].best=Math.max(st[test.id].best,score); st[test.id].attempts.push({date:Date.now(),score});
  const bonus = right + (passed?5:0); p.stars=(p.stars||0)+bonus; save();
  logEvent(p,"test",`${PLAN?"מבחן על "+PLAN.data.title:test.t}: ${score}${passed?" ✓":""}`);
  tone(passed);
  const canLevel = !PLAN && test.id==="final" && passed && p.level<3;
  const strip = h => h.replace(/<[^>]+>/g,"").trim();
  app.innerHTML = `<div class="card result pop">
    <div class="result-ic ${passed?"ok":"bad"}">${icon(passed?"trophy":"rocket",36)}</div>

    <h2>${passed?(test.id==="final"?"עברת את מבחן סיום הרמה!":"עברת את המבחן!"):"עוד קצת תרגול ותעברו!"}</h2>
    <p style="font-size:18px">${right} תשובות נכונות מתוך ${qs.length} · קיבלת ${bonus} כוכבים${passed?" (כולל 5 בונוס על מעבר)":""}${isBest&&st[test.id].attempts.length>1?" · שיא חדש! 🔥":""}</p>
    ${canLevel?`<div class="card banner" style="justify-content:center"><b style="font-size:16px">הרמה הבאה (${LEVELS[p.level].name}) פתוחה לך!</b><button class="btn" id="lvl">לעלות רמה</button></div>`:""}
    ${wrong.length?`<div class="review"><h3 style="margin-bottom:8px">בואו נלמד מהטעויות:</h3>${wrong.map(({q,i})=>`<div class="r"><div>ענית: <span class="en">${esc(strip(q.opts[answers[i]]))}</span> · נכון: <b class="en">${esc(strip(q.opts[q.a]))}</b></div><div class="en" style="color:var(--muted);text-align:left">${esc(q.review.en)}</div><div style="color:var(--muted)">${esc(q.review.he)}</div></div>`).join("")}</div>`:`<p style="font-size:18px">אפס טעויות – מושלם! 🏆</p>`}
    <div class="nav"><button class="btn" id="again">מבחן חוזר</button><button class="btn ghost" id="list">${PLAN?"לתוכנית":"לכל המבחנים"}</button><button class="btn ghost" id="home">לדף הבית</button></div></div>`;
  $("#again").onclick=()=>startTest(test.id); $("#list").onclick=PLAN?backHome:renderTests; $("#home").onclick=backHome;
  if(canLevel) $("#lvl").onclick=()=>{ p.level++; save(); renderHome(); };
}

async function imageToBlob(src, limits){
  const ok = limits && limits.mediaTypes.includes(src.type) && src.size <= limits.maxInputBytes;
  if(ok) return src;
  const url=URL.createObjectURL(src);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const scale=Math.min(1, 2400/Math.max(img.naturalWidth||1,img.naturalHeight||1));
    const c=document.createElement("canvas"); c.width=Math.max(1,(img.naturalWidth||800)*scale); c.height=Math.max(1,(img.naturalHeight||600)*scale);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.88));
  }catch(e){ throw new Error("img"); } finally{ URL.revokeObjectURL(url); }
}

async function extractFile(file, limits, status){

  const maxImgs = limits ? limits.maxCount : 0;
  const out={text:"",images:[]};
  if(file.type.startsWith("image/") || IMG_EXT.includes(ext)){
    if(!maxImgs) throw new Error("noimg");
    out.images=[await imageToBlob(file, limits)]; return out;
  }
  if(ext==="pdf" || file.type==="application/pdf"){
    status("טוען קורא PDF…"); await loadScript(LIB.pdf); await loadScript(LIB.pdfw);
    const doc=await pdfjsLib.getDocument({data:await buf()}).promise;
    const n=Math.min(doc.numPages,60); const parts=[];
    for(let i=1;i<=n;i++){ status(`קורא עמוד ${i} מתוך ${doc.numPages}…`); const pg=await doc.getPage(i); const tc=await pg.getTextContent(); parts.push(tc.items.map(t=>t.str).join(" ")); }
    out.text=parts.join("\n\n");
    if(out.text.replace(/\s/g,"").length < 150 && maxImgs){ // scanned PDF → send page images
      for(let i=1;i<=Math.min(doc.numPages,maxImgs);i++){
        status(`סורק עמוד ${i} כתמונה…`);
        const pg=await doc.getPage(i), vp=pg.getViewport({scale:1.6}), c=document.createElement("canvas");
        c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        out.images.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.85)));
      }
    }
    return out;
  }
  if(ext==="docx"){ status("קורא מסמך Word…"); await loadScript(LIB.mammoth); out.text=(await mammoth.extractRawText({arrayBuffer:await buf()})).value; return out; }
  if(["pptx","xlsx","odt","odp","ods","epub"].includes(ext)){
    status("פותח את הקובץ…"); await loadScript(LIB.jszip); const zip=await JSZip.loadAsync(await buf());
    const names=Object.keys(zip.files), read=n=>zip.file(n).async("string"), num=n=>parseInt((n.match(/(\d+)\.xml$/)||[0,0])[1],10);
    if(ext==="pptx"){ const sl=names.filter(n=>/^ppt\/(slides|notesSlides)\/\w+\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b)); for(const n of sl) out.text+=xmlText(await read(n),"a:t")+"\n"; }
    else if(ext==="xlsx"){ if(zip.file("xl/sharedStrings.xml")) out.text+=xmlText(await read("xl/sharedStrings.xml"),"t")+"\n"; for(const n of names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n))) out.text+=xmlText(await read(n),"t")+" "+xmlText(await read(n),"v")+"\n"; }
    else if(ext==="epub"){ for(const n of names.filter(n=>/\.(x?html?)$/i.test(n)).sort()) out.text+=stripTags(await read(n))+"\n"; }
    else if(zip.file("content.xml")) out.text=(await read("content.xml")).replace(/<\/text:p>/g,"\n").replace(/<[^>]+>/g," ");
    return out;
  }
  if(ext==="doc"||ext==="ppt"||ext==="xls"){ // old binary Office: pull readable text runs
    const b=new Uint8Array(await buf());
    const latin=new TextDecoder("latin1").decode(b).match(/[\x20-\x7E\t]{5,}/g)||[];
    const u16=new TextDecoder("utf-16le").decode(b.byteLength%2?b.slice(0,-1):b).match(/[ -~֐-׿ -ɏ\s]{5,}/g)||[];
    out.text=(u16.join(" ").length>latin.join(" ").length?u16:latin).join(" ").replace(/\s+/g," ");
    return out;
  }
  let t=await file.text();
  if(["html","htm","xhtml","xml"].includes(ext)) t=stripTags(t);
  if(ext==="rtf") t=t.replace(/\\'[0-9a-f]{2}/gi,"").replace(/\\[a-z]+-?\d* ?/gi,"").replace(/[{}]/g,"");
  if((t.match(/\uFFFD|\u0000/g)||[]).length > t.length*0.05) throw new Error("binary");
  out.text=t; return out;
}

function planPrompt(p, fileName, text, nImgs, wish){
  const lv=LEVELS[p.level-1], G=group(p);
  const AUD={tod:"Toddler aged 2-5 who cannot read yet: ONLY concrete, picturable single words (objects, animals, colors, actions) with a clear emoji each; sentences of 2-4 words; NO grammar items (empty array); reading text of 2-3 tiny sentences; plan steps only use cards, listen, quiz, test.",kid:"Young child: very simple words, short sentences, playful tone, every vocabulary item gets a fitting emoji.",teen:"Teenager: age-appropriate, not childish. Use a fitting emoji per vocabulary item.",adult:"Adult learner: practical, mature, real-life and professional contexts, never childish. Use a fitting emoji per vocabulary item."}[G];
  return `You are an expert English teacher for Hebrew-speaking children in Israel. Build a personalized English learning plan based EXACTLY on the material below.

STUDENT: ${p.age} years old. English level: ${["beginner","intermediate","advanced"][p.level-1]} (${lv.desc}).${isSchool(p)?` Israeli school grade ${p.grade}${p.bagrut?`, preparing for the ${p.bagrut}-point English Bagrut`:""}; align vocabulary and grammar with the Israeli Ministry of Education English Curriculum (Lexical/Grammar ${BAND_LABEL[bandOf(p)].split(" ·")[0]}). Personal vocabulary level ${wlOf(p).toFixed(1)}/5.`:""}
${AUD}
${wish ? `STUDENT'S REQUEST: ${wish}\n` : ""}
MATERIAL (from file "${fileName}"):
${text ? "<<<\n"+text+"\n>>>" : ""}${nImgs ? `\n(${nImgs} image(s) of the material are attached — read them carefully, including handwriting and printed text.)` : ""}

RULES
- Everything must come from the material: its actual words, topic, story, and grammar points. If it is an English worksheet, exam, or text, reuse its vocabulary and target exactly its grammar points. If it is in Hebrew or another language, teach the English needed to talk about its content.
- Match difficulty to the student's age and level.
- vocab: 12-20 items. "en" = English word or short phrase, "he" = accurate natural Hebrew, "emoji" = one emoji.
- sentences: 6-8 English sentences of 3-10 words each, using the vocabulary, with NO punctuation except apostrophes (used in a word-ordering game). "he" = Hebrew translation.
- grammar: 6-8 items. "q" = an English sentence containing exactly one "___", "opts" = 2-4 options, "a" = index of the correct option, "he" = one short Hebrew explanation of the rule.
- reading: an English passage built on the material (young beginner: 3-5 short sentences; advanced teen: 150-220 words) with 4 multiple-choice questions, each with 3 options, "a" = correct index, "he" = Hebrew translation of the question.
- plan: 5-7 ordered steps in Hebrew, each a ~15 minute session. "activity" is one of: cards, quiz, listen, spell, build, read, grammar, test (the app's activities). Finish with "test".
- title: short Hebrew title. summary: 1-2 Hebrew sentences on what the material is about and what she will learn. icon: one emoji.

${LANG==="en"?"- UI language is ENGLISH: write title, summary and plan titles/descriptions in English (keep every \"he\" field in Hebrew).\n":""}Reply with ONLY this JSON:
{"title":"","icon":"","summary":"","vocab":[{"en":"","he":"","emoji":""}],"sentences":[{"en":"","he":""}],"grammar":[{"q":"","opts":[""],"a":0,"he":""}],"reading":{"title":"","text":"","qs":[{"q":"","he":"","opts":["","",""],"a":0}]},"plan":[{"title":"","desc":"","activity":"cards"}]}`;
}

function normalizePlan(j){
  if(!j || typeof j!=="object") throw new Error("shape");
  const S=x=>String(x==null?"":x).trim(), seen=new Set();
  const vocab=(Array.isArray(j.vocab)?j.vocab:[]).map(v=>[S(v&&v.en),S(v&&v.he),S(v&&v.emoji)||"📌"]).filter(v=>v[0]&&v[1]&&!seen.has(v[0].toLowerCase())&&seen.add(v[0].toLowerCase()));
  if(vocab.length<4) throw new Error("shape");
  const sentences=(Array.isArray(j.sentences)?j.sentences:[]).map(x=>[S(x&&x.en).replace(/[^A-Za-z0-9' ]/g," ").replace(/\s+/g," ").trim(),S(x&&x.he)]).filter(x=>x[0].split(" ").length>=2&&x[1]);
  const grammar=(Array.isArray(j.grammar)?j.grammar:[]).map(g=>({q:S(g&&g.q),opts:(Array.isArray(g&&g.opts)?g.opts:[]).map(S).filter(Boolean),a:Number(g&&g.a),he:S(g&&g.he)})).filter(g=>g.q.includes("___")&&g.opts.length>=2&&g.a>=0&&g.a<g.opts.length);
  let reading=[]; const r=j.reading;
  if(r&&S(r.text)){ const qs=(Array.isArray(r.qs)?r.qs:[]).map(q=>({q:S(q&&q.q),he:S(q&&q.he),opts:(Array.isArray(q&&q.opts)?q.opts:[]).map(S).filter(Boolean),a:Number(q&&q.a)})).filter(q=>q.q&&q.opts.length>=2&&q.a>=0&&q.a<q.opts.length); if(qs.length) reading=[{title:S(r.title)||"Reading",text:S(r.text),qs}]; }
  const acts=["cards","quiz","listen","spell","build","read","grammar","test"];
  const plan=(Array.isArray(j.plan)?j.plan:[]).map(x=>({title:S(x&&x.title),desc:S(x&&x.desc),activity:acts.includes(S(x&&x.activity))?S(x.activity):"cards"})).filter(x=>x.title).slice(0,8);
  return {title:S(j.title)||"תוכנית למידה",icon:S(j.icon)||"📄",summary:S(j.summary),vocab,sentences,grammar,reading,plan};
}

async function makePlan(){
  const p=cur(), st=$("#upl-status"), make=$("#make"), stop=$("#stop"), wish=$("#wish").value.trim();
  const status=(msg,cls="")=>{ st.className="upl-status "+cls; st.innerHTML=msg; };
  if(!(U.doc||U.files.length)||!SAMPLE) return;
  const lock=on=>app.querySelectorAll("input,.src,#make,[data-rm],#rmdoc").forEach(el=>{ el.style.pointerEvents=on?"none":""; if("disabled" in el) el.disabled=on; });
  lock(true);
  const imgLim=LIMITS&&LIMITS.images||null;
  let ex, fileName;
  try{
    if(U.doc){
      if(U.doc.size>50*1048576) throw new Error("big");
      fileName=U.doc.name;
      status(`<span class="spin"></span>קורא את הקובץ…`);
      ex=await extractFile(U.doc, imgLim, m=>status(`<span class="spin"></span>${m}`));
    } else {
      if(!imgLim) throw new Error("noimg");
      fileName=U.files.length>1?`${U.files.length} תמונות`:(U.files[0].name||"צילום");
      status(`<span class="spin"></span>מכין את התמונות…`);
      ex={text:"",images:[]};
      for(const f of U.files.slice(0,imgLim.maxCount)) ex.images.push(await imageToBlob(f,imgLim));
    }
  }catch(e){
    lock(false);
    const m = e.message==="big" ? "הקובץ גדול מ-50MB. נסו קובץ קטן יותר."
      : e.message==="lib" ? "לא הצלחתי לטעון את הכלי לקריאת הקובץ. בדקו חיבור ונסו שוב."
      : e.message==="noimg" ? "אי אפשר לשלוח תמונות כאן. נסו PDF, Word או טקסט."
      : e.message==="img" ? "לא הצלחתי לפתוח את התמונה. אם זה צילום HEIC מאייפון, נסו לבחור אותו דרך \"תמונות מהגלריה\"."
      : "לא הצלחתי לקרוא את הקובץ. נסו לשמור אותו כ-PDF, Word או תמונה.";
    return status(m,"bad");
  }
  const text=(ex.text||"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim().slice(0,60000);
  if(text.length<20 && !ex.images.length){ lock(false); return status("לא נמצא בקובץ תוכן ללמידה. אם זה דף סרוק, נסו לצלם אותו.","bad"); }
  U.ctl=new AbortController(); stop.hidden=false; stop.disabled=false; stop.style.pointerEvents="";
  const found=text.length>=20?`${text.length.toLocaleString(LOC())} תווים`:`${ex.images.length} ${ex.images.length>1?"תמונות":"תמונה"}`;
  status(`<span class="spin"></span>קראתי (${found}). בונה תוכנית מותאמת – בדרך כלל חצי דקה עד דקה.`);
  try{
    const raw=await SAMPLE.json(planPrompt(p,fileName,text.length>=20?text:"",ex.images.length,wish),{
      images:ex.images.length?ex.images:undefined, signal:U.ctl.signal, modelTier:"default",
      onText:({text:t})=>status(`<span class="spin"></span>כותב את התוכנית… ${Math.min(99,Math.round(t.length/60))}%`)
    });
    const data=normalizePlan(raw);
    const plan={id:"pl"+Date.now(),fileName,createdAt:Date.now(),level:p.level,data,done:[]};
    p.plans=p.plans||[]; p.plans.push(plan); save(); logEvent(p,"plan",`תוכנית חדשה: ${data.title}`);
    U={files:[],doc:null,ctl:null}; tone(true); renderPlan(plan.id);
  }catch(e){
    stop.hidden=true; lock(false); U.ctl=null;
    if(e&&e.code==="cancelled") return status("נעצר. אפשר לנסות שוב מתי שרוצים.");
    if(e&&e.message==="shape") return status("התוכנית שהתקבלה לא הייתה שלמה. נסו שוב.","bad");
    status(ERR_HE[e&&e.code]||"משהו השתבש. נסו שוב בעוד רגע.","bad");
    if(e&&["not_granted","sampling_disabled"].includes(e.code)){ $("#make").disabled=true; if(EDITION==="community") st.innerHTML+=` ${edLink(PUBLIC_URL,"יצירת תוכנית בגרסה הציבורית","link")}`; }
  }
}

const DICT=new Map(); Object.values(CONTENT).forEach(c=>c.vocab.forEach(v=>{ if(!DICT.has(v[0].toLowerCase())) DICT.set(v[0].toLowerCase(),v[1]); }));
const TR_CACHE=new Map();
function localTr(t){
  const k=String(t).trim().toLowerCase().replace(/[^a-z' -]/g,"").trim(); if(!k) return null;
  const p=cur(); if(p) for(const pl of (p.plans||[])) for(const v of pl.data.vocab) if(v[0].toLowerCase()===k) return v[1];
  return DICT.get(k) || (k.endsWith("s")&&DICT.get(k.slice(0,-1))) || null;
}
async function translate(text){
  const loc=localTr(text); if(loc) return loc;
  if(TR_CACHE.has(text)) return TR_CACHE.get(text);
  if(!SAMPLE) throw {code:"noclaude"};
  const p=cur();
  const {text:out}=await SAMPLE(`Translate the following English into natural Hebrew${p?` for a ${p.age}-year-old learner`:""}. If it is a single word or short phrase, give its Hebrew meaning (at most one short alternative after a comma). Reply with ONLY the Hebrew, nothing else.\n\n${text}`,{modelTier:"quick",cache:{gcTime:86400000}});
  const r=out.trim(); TR_CACHE.set(text,r); return r;
}
const trErr=e=>e&&e.code==="not_granted"?"לא אושרה גישה ל-Claude, ולכן אין תרגום":e&&e.code==="rate_limited"?"יותר מדי בקשות, אפשר לנסות שוב עוד מעט":"תרגום של מילים חדשות דורש מפתח Claude בשרת";

const GAMES={race:{n:"מרוץ מילים",d:"10 מילים – מי מתרגם מהר ונכון יותר",ic:"rocket",len:10},spell:{n:"דו-קרב איות",d:"8 מילים – שומעים וכותבים באנגלית",ic:"spell",len:8}};

function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }

function gamePool(d,spell){ const seen=new Set(); return DIFFS[d].tracks.flatMap(k=>CONTENT[k].vocab).filter(v=>{ const k=v[0].toLowerCase(); if(seen.has(k)) return false; seen.add(k); return !spell || /^[a-z]+$/i.test(v[0]); }); }

  const r=seeded(inv.gid), spell=inv.t==="spell", pool=gamePool(inv.d,spell), words=sShuffle(pool,r).slice(0,GAMES[inv.t].len);
  return words.map(w=>({w,opts:spell?null:sShuffle([w,...sShuffle(pool.filter(x=>x!==w),r).slice(0,3)],r)}));
}

  COMM.peers=ch.peers; const me=ch.peers.find(x=>x.sameTab); if(me) COMM.myPeer=me.peer;
  const p=cur(); if(!p) return;
  // incoming invite
  for(const x of others()){
    const inv=x.presence.inv;
    if(inv&&inv.to===COMM.myPeer&&!COMM.handled.has(inv.gid)&&Date.now()-x.updatedAt<60000&&!COMM.G){ COMM.handled.add(inv.gid); showInvite(x,inv); }
    const ans=x.presence.ans;
    if(COMM.myInv&&ans&&ans.gid===COMM.myInv.gid){
      const mi=COMM.myInv; COMM.myInv=null; clearTimeout(mi.timer);
      if(ans.ok) startGame(mi,x.presence); else { COMM.lobby&&COMM.lobby.presence({inv:null}); flash(`${x.presence.n} לא יכול/ה לשחק עכשיו`); if($("#comm-screen")) renderCommunity(); }
    }
  }
  if(COMM.myInv && !others().some(x=>x.peer===COMM.myInv.to)){ clearTimeout(COMM.myInv.timer); COMM.myInv=null; COMM.lobby&&COMM.lobby.presence({inv:null}); }
  if($("#comm-list")) $("#comm-list").innerHTML=memberList();
  wireMembers();
}

function sendInvite(peer,t,d){
  if(!COMM.lobby) return;
  const gid=(Date.now().toString(36)+Math.random().toString(36).slice(2,6)).toLowerCase();
  const inv={to:peer,gid,t,d,at:Date.now()};
  COMM.myInv={...inv,timer:setTimeout(()=>{ if(COMM.myInv&&COMM.myInv.gid===gid){ COMM.myInv=null; COMM.lobby&&COMM.lobby.presence({inv:null}); flash("אין תשובה להזמנה"); if($("#comm-list")) $("#comm-list").innerHTML=memberList(), wireMembers(); } },60000)};
  COMM.lobby.presence({inv,ans:null});
  if($("#comm-list")){ $("#comm-list").innerHTML=memberList(); wireMembers(); }
}
