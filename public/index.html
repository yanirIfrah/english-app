<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5D9AE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לירד נוכחות">
<title>לירד שעון נוכחות</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#0f172a;--ink-2:#334155;--muted:#64748b;--line:#e2e8f0;--pri:#5D9AE2;--pri-2:#3d7fcf;--pri-soft:#e3eefb;--ok:#059669;--ok-soft:#d1fae5;--warn:#b45309;--warn-soft:#fef3c7;--bad:#dc2626;--bad-soft:#fee2e2;--vac:#5D9AE2;--vac-soft:#e3eefb;--sick:#dc2626;--sick-soft:#fee2e2;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Rubik,Arial,sans-serif;font-size:15.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:40;background:rgba(244,246,248,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;margin:0 -14px 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;flex:1;min-width:0;color:var(--ink-2)}.brand img{height:34px;width:auto;flex:none}.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:400px){.brand span{display:none}}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:14px;font-weight:600;max-width:46vw}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}.chip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--pri-soft);color:var(--pri-2);white-space:nowrap}
.badge.mgr{background:var(--warn-soft);color:var(--warn)}.badge.lock{background:var(--bad-soft);color:var(--bad)}.badge.gray{background:#eef2f6;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:19px;margin:0}h3{font-size:16px;margin:0}
.sub{color:var(--muted);margin:0 0 12px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;min-height:44px}
.btn:hover{background:var(--pri-2)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line)}.btn.ghost:hover{background:#f8fafc}
.btn.danger{background:var(--bad)}.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}.btn.block{width:100%}
.link{background:none;border:0;color:var(--pri);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;color:var(--ink-2)}
.field{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;min-height:44px;outline:none}
.field:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(93,154,226,.22)}
.field.ltr{direction:ltr;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{min-width:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}.ok{color:var(--ok);font-size:14px;min-height:20px;margin-top:8px}
.hint{color:var(--muted);font-size:13px;margin-top:6px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px}.check input{width:18px;height:18px;accent-color:var(--pri)}
.auth{max-width:420px;margin:6vh auto 0}.auth .lgbig{width:190px;max-width:70%;height:auto;margin:4px auto 14px;display:block}
.auth h1{text-align:center}.auth .sub{text-align:center}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.month h2{font-size:20px;text-align:center;flex:1}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none;color:var(--ink-2)}.ib:disabled{opacity:.35}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.stat .v{font-size:21px;font-weight:800;line-height:1.2}.stat .l{font-size:12.5px;color:var(--muted)}
.stat.vac .v{color:var(--vac)}.stat.sick .v{color:var(--sick)}.stat.ot .v{color:var(--warn)}
.today{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#f3f8fe,#e3eefb);border-color:#bcd6f4}
.today .t1{font-weight:700}.today .t2{color:var(--ink-2);font-size:14px}
.days{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.day{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eef2f6;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.day:last-child{border-bottom:0}.day:hover{background:#f8fafc}.day.we{background:#fafbfc}.day.td{background:#f3f8fe}.day.ro{cursor:default}.day.ro:hover{background:inherit}
.dnum{width:44px;flex:none;text-align:center;line-height:1.1}.dnum b{display:block;font-size:18px}.dnum span{font-size:11.5px;color:var(--muted)}
.dmain{flex:1;min-width:0;font-size:14.5px}.dmain .tm{direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.dmain .nt{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtot{font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;min-width:46px;text-align:left}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-inline-end:6px}
.pill.vac{background:var(--vac-soft);color:var(--vac)}.pill.sick{background:var(--sick-soft);color:var(--sick)}.pill.empty{color:#94a3b8;font-weight:500;padding:0}
.lockic{color:#94a3b8}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f5f9;border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}.seg button.on.vac{color:var(--vac)}.seg button.on.sick{color:var(--sick)}
.tw{display:flex;gap:6px}.tw .field{flex:1;min-width:0;direction:ltr;text-align:center;font-variant-numeric:tabular-nums}.tw .btn{padding:0 10px;flex:none}
.times{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:480px){.times{grid-template-columns:1fr 1fr;gap:10px}}
.total{margin-top:14px;background:#f3f8fe;border:1px solid #bcd6f4;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.total b{font-size:20px;direction:ltr}
.list .it{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #eef2f6;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.list .it:last-child{border-bottom:0}.list .it:hover{background:#f8fafc}
.list .nm{flex:1;min-width:0}.list .nm b{display:block}.list .nm span{font-size:13px;color:var(--muted)}
.list .fig{text-align:left;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.list .fig b{display:block;font-size:17px;color:var(--ink);direction:ltr}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:6px;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;font-weight:600;text-align:right}.menu button:hover{background:#f1f5f9}
.menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.menu .mh b{display:block}.menu .mh span{font-size:13px;color:var(--muted)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(93,154,226,.3);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
.empty{color:var(--muted);text-align:center;padding:26px 12px}
svg.i{width:18px;height:18px;flex:none}
/* ---------- printable report ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
}
.rep{font-family:Arial,"Segoe UI",sans-serif;color:#000;font-size:11.5px;direction:rtl}
.rep+.rep{page-break-before:always;break-before:page}
.rep .rh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #5D9AE2;padding-bottom:8px;margin-bottom:10px}
.rep .rh h1{font-size:19px;margin:0;color:#3d7fcf}.rep .rh .co{font-size:15px;font-weight:700}
.rep .meta{display:grid;grid-template-columns:repeat(4,auto);gap:4px 18px;margin-bottom:10px;font-size:12px}.rep .meta b{font-weight:700}
.rep table{width:100%;border-collapse:collapse}.rep th,.rep td{border:1px solid #cbd5e1;padding:3px 5px;text-align:center}
.rep th{background:#eef5fd;font-weight:700}.rep tr.we td{background:#f8fafc}.rep td.nt{text-align:right;max-width:150px}
.rep td.tm{direction:ltr}.rep .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.rep .sum div{border:1px solid #cbd5e1;border-radius:6px;padding:5px 8px}.rep .sum b{display:block;font-size:14px}
.rep .sig{display:flex;justify-content:space-between;margin-top:26px;gap:30px}.rep .sig div{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center}
.rep .foot{margin-top:10px;font-size:10px;color:#64748b}

.lfs{display:grid;gap:8px;margin-top:6px}.lf{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-2)}
.lfi{width:30px;height:30px;border-radius:9px;background:var(--pri-soft);color:var(--pri-2);display:grid;place-items:center;flex:none}
.tab .cnt{background:#ef4444;color:#fff;border-radius:999px;font-size:11.5px;min-width:19px;height:19px;padding:0 5px;display:inline-grid;place-items:center;margin-inline-start:2px}
.dmain .nt.pend{color:var(--warn);white-space:normal}.dmain .nt.rej{color:var(--bad);white-space:normal}
.note-box{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:#7c4a03;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.55}.note-box svg{margin-top:3px}
.pendcard{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--warn-soft);border-color:#fcd34d;color:#7c4a03;cursor:pointer}.pendcard b{flex:1}
.req .cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px}
.req .cmp>div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}.req .cmp span{display:block;font-size:12px;color:var(--muted)}
.req .cmp .new{background:#f3f8fe;border-color:#bcd6f4}.req .cmp i{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}.req .arrow{color:var(--muted);font-size:18px}
.emps{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 12px 10px;margin-top:8px}
.seg.two-seg{grid-template-columns:1fr 1fr}
.prev{overflow:auto}.prev .rep{min-width:640px}.prev .rep+.rep{margin-top:24px;border-top:2px dashed var(--line);padding-top:16px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chipf{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chipf.on{background:var(--pri);border-color:var(--pri);color:#fff}
.urow{padding:0!important}.urow .ubody{flex:1;display:flex;align-items:center;gap:10px;padding:12px;background:none;border:0;text-align:right;min-width:0}.urow .ubody:hover{background:#f8fafc}
.urow .del{margin-inline-end:10px;color:var(--bad);border-color:#fecaca}.urow .del:hover{background:var(--bad-soft)}
.set h3{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pdf-host{position:fixed;left:-10000px;top:0;width:718px;background:#fff;padding:0;z-index:-1}
.pdf-doc{width:718px!important;max-width:718px;box-sizing:border-box;margin:0;padding:0;background:#fff;direction:rtl;letter-spacing:.01px;overflow:hidden}
.pdf-doc .rep{min-width:0!important;width:100%;box-sizing:border-box;margin:0;padding:0;border:0}
.pdf-doc .rep table{width:100%;max-width:100%}
.pdf-doc .rep th,.pdf-doc .rep td{padding:2px 4px;line-height:1.3}.pdf-doc .rep .rh{padding-bottom:6px;margin-bottom:8px}.pdf-doc .rep .meta{margin-bottom:8px}.pdf-doc .rep .sum{margin-top:8px}.pdf-doc .rep .sig{margin-top:18px}.pdf-doc .rep .foot{margin-top:6px}
.pdf-doc .rep td.nt{max-width:none;width:24%;word-break:break-word;overflow-wrap:anywhere}
.pdf-doc .rep .rh,.pdf-doc .rep .sum,.pdf-doc .rep .sig,.pdf-doc .rep .foot{max-width:100%;box-sizing:border-box}.pdf-doc .rep{font-size:10.5px}.pdf-doc .rep table{table-layout:auto}

.top .burger{position:relative;flex:none}.top .burger .cnt.dot{position:absolute;top:-4px;left:-4px;background:#ef4444;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center}
.brand span{font-size:16px;color:var(--ink)}
#drawer-root .dov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:55;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(320px,86vw);background:#fff;z-index:56;box-shadow:-10px 0 30px rgba(15,23,42,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top);overflow:auto}
.drawer.open{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.duser{display:flex;align-items:center;gap:10px;padding:14px}.duser b{display:block}.duser span{font-size:13px;color:var(--muted)}
.av.big{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:700;flex:none}
.dnavs{padding:4px 8px;border-bottom:1px solid var(--line)}.dnav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:10px;font-weight:600;font-size:15px;text-align:right;color:var(--ink-2)}
.dnav span{flex:1}.dnav:hover{background:#f1f5f9}.dnav.on{background:var(--pri-soft);color:var(--pri-2)}
.dnav .cnt{flex:none;background:#ef4444;color:#fff;border-radius:999px;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.dinfo{padding:6px 14px 10px;flex:1}.dtitle{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px;text-transform:uppercase}
.drow{display:flex;justify-content:space-between;font-size:14.5px;padding:3px 0}.dnote{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.dfoot{border-top:1px solid var(--line);padding:6px 8px calc(12px + env(safe-area-inset-bottom))}
body.noscroll{overflow:hidden}
.cfm{z-index:90;align-items:center}.sheet.small{max-width:400px;border-radius:18px;margin:0 16px}.cfm-msg{font-size:15.5px;line-height:1.6;color:var(--ink)}
.filt .actions{flex-wrap:wrap}

.pwf{position:relative}.pwf .field{padding-left:44px}.pw-eye{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:9px}.pw-eye:hover{background:#f1f5f9;color:var(--ink-2)}
.tw .pwf .field{text-align:right}
.remind{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f3f8fe;border-color:#bcd6f4}.remind>svg{color:var(--pri-2)}
.rep tr.k-sick td,.rep .k-sick{color:#dc2626!important;font-weight:700}.rep tr.k-sick td{background:#fef2f2}
.rep tr.k-vacation td,.rep .k-vacation{color:#5D9AE2!important;font-weight:700}.rep tr.k-vacation td{background:#eef5fd}

.k-vac{color:var(--vac)!important;font-weight:700}.k-sick{color:var(--sick)!important;font-weight:700}
.stat.vac .v,.stat.sick .v{font-weight:800}.pill.vac,.pill.sick{font-weight:700}
.drow.vac b,.drow.vac span{color:var(--vac);font-weight:700}.drow.sick b,.drow.sick span{color:var(--sick);font-weight:700}
.drow.lnk{width:calc(100% + 12px);margin:0 -6px;padding:5px 6px;background:none;border:0;border-radius:8px;cursor:pointer;font:inherit;text-align:inherit;align-items:center}
.drow.lnk:hover,.drow.lnk:active{background:#f1f5f9}.drow.lnk b{display:inline-flex;align-items:center;gap:4px}.drow.lnk b svg{opacity:.6}
.dlink{display:flex;align-items:center;gap:6px;width:100%;margin-top:6px;padding:8px 10px;border:1px dashed #bcd6f4;border-radius:10px;background:#f6faff;color:var(--pri-2);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.dmonth{margin-top:14px;padding:10px 12px 8px;border:1.5px solid #bcd6f4;border-radius:14px;background:linear-gradient(180deg,#eef5fd,#fff);box-shadow:0 2px 8px rgba(93,154,226,.12)}
.dmt{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:800;color:var(--pri-2);margin-bottom:4px}.dmtag{margin-inline-start:auto;font-size:11px;font-weight:700;background:var(--pri);color:#fff;border-radius:999px;padding:2px 8px}
.lvh{display:flex;align-items:center;gap:6px;margin:16px 0 8px;font-size:16px}
.lvcnt{font-size:13.5px}.lvdays{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.lvdays i{font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px}
.lvdays.big i{font-size:13.5px;padding:4px 9px}.ldv{background:var(--vac-soft);color:var(--vac)}.lds{background:var(--sick-soft);color:var(--sick)}.lvdays i.now{outline:2px solid currentColor}

 home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',alert:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/>',file:'<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',

 left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',

 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3"/>',
 x:'<path d="M18 6L6 18M6 6l12 12"/>',back:'<path d="M9 18l6-6-6-6"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/>',
 note:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',check:'<path d="M5 12l5 5L20 7"/>',inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',eyeoff:'<path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'};
const icon=(n,s=18)=>`<svg class="i" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
function toast(t,ms=2600){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }
const closeModal=()=>{ $("#modal-root").innerHTML=""; };
// in-app confirmation (browser confirm() windows are blocked in some browsers)
function askConfirm(msg,{ok="אישור",cancel="ביטול",danger=false}={}){
  return new Promise(res=>{
    const d=document.createElement("div"); d.className="modal cfm";
    d.innerHTML=`<div class="sheet small" role="alertdialog"><div class="cfm-msg">${esc(msg).replace(/\n/g,"<br>")}</div>
      <div class="row"><button class="btn ghost" data-a="0">${esc(cancel)}</button><button class="btn ${danger?"danger":""}" data-a="1">${esc(ok)}</button></div></div>`;
    const done=v=>{ d.remove(); res(v); };
    d.addEventListener("click",e=>{ const b=e.target.closest("[data-a]"); if(b) done(b.dataset.a==="1"); else if(e.target===d) done(false); });
    document.body.appendChild(d); d.querySelector('[data-a="1"]').focus();
  });
}

/* ========================== dates & hours ========================== */
const HEB_MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
const HEB_DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"], HEB_D1=["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays=(s,n)=>{ const d=parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
// Israel date, whatever the device clock zone is
const todayStr=()=>{ try{ return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jerusalem",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date()); }catch(e){ return ymd(new Date()); } };
const curYM=()=>todayStr().slice(0,7);
const ymAdd=(ym,n)=>{ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ymLabel=ym=>{ const [y,m]=ym.split("-").map(Number); return `${HEB_MONTHS[m-1]} ${y}`; };
const daysIn=ym=>{ const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };
const dowOf=s=>parseD(s).getDay();
const dShort=s=>{ const [y,m,d]=s.split("-").map(Number); return `${d}.${m}.${y}`; };
const dLabel=s=>`יום ${HEB_DAYS[dowOf(s)]}, ${dShort(s)}`;
const tmin=t=>{ if(!t) return null; const [h,m]=String(t).split(":").map(Number); return h*60+m; };
const hhmm=t=>t?String(t).slice(0,5):"";
function entryMin(e){ if(!e||e.kind!=="work"||!e.start_time||!e.end_time) return 0; let m=tmin(e.end_time)-tmin(e.start_time); if(m<=0) m+=1440; return Math.max(0,m-(e.break_min||0)); }
const fmtH=m=>`${Math.floor(m/60)}:${pad(Math.round(m%60))}`;
const decH=m=>(Math.round(m/60*100)/100).toFixed(2);
function splitOT(m){ const std=Math.round((Number(S.cfg.stdHours)||8.6)*60), t1=Math.round((S.cfg.ot125Hours==null?2:Number(S.cfg.ot125Hours))*60); const reg=Math.min(m,std), o1=Math.min(Math.max(m-std,0),t1), o2=Math.max(m-std-t1,0); return {reg,o1,o2}; }
const cfgInt=(k,d,lo,hi)=>{ const v=parseInt(S.cfg[k],10); return isNaN(v)?d:Math.min(hi,Math.max(lo,v)); };

function subscribe(){
  if(S.chan){ try{ S.sb.removeChannel(S.chan); }catch(e){} }
  const again=()=>{ clearTimeout(S._rt); S._rt=setTimeout(async()=>{ if(isAdmin()){ await loadPendingCount(); paintBadge(); } if(!$(".modal")&&S.tab!=="reports"&&!(S.tab==="settings"&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#view"))) refresh(); if($("#dinfo")) fillDrawerInfo(); },700); };
  S.chan=S.sb.channel("live-"+S.me.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"entries"},again)
    .on("postgres_changes",{event:"*",schema:"public",table:"corrections"},again)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"profiles",filter:"id=eq."+S.me.id},pl=>{ const r=pl.new; if(r.locked) return signOut("החשבון נחסם. יש לפנות למנהל."); const roleChanged=r.role&&r.role!==S.me.role; S.me={...S.me,...r}; if(roleChanged){ toast(r.role==="admin"?"קיבלת הרשאות ADMIN":"הרשאות ה-ADMIN הוסרו",3500); closeModal(); closeDrawer(); render(); } })
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},pl=>{ if(!isAdmin()) return; const r=pl.new&&pl.new.id?pl.new:null; if(r&&r.id===S.me.id) return; loadUsers().then(()=>again()); })
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"app_config"},pl=>{ if(pl.new&&pl.new.data){ S.cfg=pl.new.data; if(S.tab==="settings"&&!$(".modal")){ if(!S._mySave) toast("ההגדרות עודכנו על ידי מנהל אחר",3000); } S._mySave=false; again(); } })
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"profiles",filter:"id=eq."+S.me.id},()=>signOut("החשבון נמחק."))
    .subscribe();
}

/* ========================== daily reminder (web push) ========================== */
const PUSH={reg:null,key:""};
const pushSupported=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function b64ToU8(b){ const p="=".repeat((4-b.length%4)%4), s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...s].map(c=>c.charCodeAt(0))); }
async function swReady(){ if(!pushSupported()) return null; if(!PUSH.reg){ try{ PUSH.reg=await navigator.serviceWorker.register("/sw.js"); await navigator.serviceWorker.ready; }catch(e){ PUSH.reg=null; } } return PUSH.reg; }
async function pushStatus(){ // "on" | "off" | "denied" | "ios-home" | "unsupported"
  if(isIOS()&&!isStandalone()) return "ios-home";
  if(!pushSupported()||!PUSH.key) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  const reg=await swReady(); if(!reg) return "unsupported";
  const sub=await reg.pushManager.getSubscription(); return sub&&Notification.permission==="granted"?"on":"off";
}
async function enablePush(){
  const reg=await swReady(); if(!reg) throw {code:"unsupported"};
  const perm=await Notification.requestPermission(); if(perm!=="granted") throw {code:"denied"};
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(PUSH.key)});
  await api("push_sub",{sub:sub.toJSON(),ua:navigator.userAgent});
}
async function disablePush(){ const reg=await swReady(); const sub=reg&&await reg.pushManager.getSubscription(); if(sub){ try{ await api("push_unsub",{endpoint:sub.endpoint}); }catch(e){} await sub.unsubscribe(); } }
async function reminderCard(){ // shown on the employee's month screen until the reminder is on
  if(S.cfg.reminder===false) return "";
  const st=await pushStatus(); if(st==="on"||st==="unsupported") return "";
  const sub=st==="ios-home"?"באייפון צריך קודם להוסיף את האפליקציה למסך הבית – נראה לך בדיוק איך."
    :st==="denied"?"ההתראות חסומות כרגע במכשיר. נראה לך איך לפתוח אותן."
    :"נשלח לך התראה אם עוד לא הזנת את שעות היום. לוקח 10 שניות.";
  return `<div class="card remind" id="rmc">${icon("bell",20)}<div style="flex:1"><b>תזכורת יומית ב-17:00</b><div class="hint" style="margin:2px 0 0">${sub}</div></div><div class="actions"><button class="btn sm" id="rmon">${st==="off"?"הפעלה":"איך מפעילים?"}</button></div></div>`;
}

}

function renderLogin(msg=""){
  authShell(`<h1 style="text-align:center">התחברות</h1><p class="sub">היכנסו עם האימייל או שם המשתמש והסיסמה שקיבלתם מהמנהל</p>

  const ts=$("#tosign"); if(ts) ts.onclick=renderSignup;
  $("#lf").onsubmit=async ev=>{
    ev.preventDefault(); const err=$("#lerr"); err.style.color="";
    if(Date.now()<LOCK_UNTIL) return err.textContent=`יותר מדי ניסיונות. נסו שוב בעוד ${Math.ceil((LOCK_UNTIL-Date.now())/1000)} שניות.`;
    const login=$("#lu").value.trim(), pw=$("#lp").value; if(!login||!pw) return err.textContent="נא למלא אימייל או שם משתמש, וסיסמה";
    $("#lgo").disabled=true; err.innerHTML='<span class="spin"></span>';
    let ok=false, rl=false;
    if(login.includes("@")){ const {error}=await S.sb.auth.signInWithPassword({email:login.toLowerCase(),password:pw}); ok=!error; rl=!!error&&error.status===429; }
    else { const u=normUser(login);
      const {error}=await S.sb.auth.signInWithPassword({email:toEmail(u),password:pw}); ok=!error;
      if(!ok){ try{ const t=await api("login_username",{username:u,password:pw}); const {error:se}=await S.sb.auth.setSession({access_token:t.access_token,refresh_token:t.refresh_token}); ok=!se; }catch(x){ rl=!!x&&x.code==="rate_limited"; } } }
    if(!ok){ $("#lgo").disabled=false; if(++FAILS>=5){ LOCK_UNTIL=Date.now()+30000; FAILS=0; } $("#lp").value=""; return err.textContent=rl?API_ERR.rate_limited:"פרטי הכניסה או הסיסמה לא נכונים"; }
    FAILS=0; await enter(err);
  };
  setTimeout(()=>{ const f=$("#lu"); if(f&&!("ontouchstart" in window)) f.focus(); },50);
}

  subscribe(); S.tab=me.role==="admin"?"home":"my"; S.view=null; S.ym=curYM(); render();

}

function wireSignup(first){
  $("#sf").onsubmit=async ev=>{
    ev.preventDefault(); const err=$("#serr");

function summarize(list){
  const s={days:0,min:0,reg:0,o1:0,o2:0,vac:0,sick:0};
  list.forEach(e=>{ if(e.kind==="work"){ const m=entryMin(e); s.days++; s.min+=m; const o=splitOT(m); s.reg+=o.reg; s.o1+=o.o1; s.o2+=o.o2; } else if(e.kind==="vacation") s.vac++; else if(e.kind==="sick") s.sick++; });
  return s;
}

function monthRange(ym){ return {kind:"month",from:ym+"-01",to:ymAdd(ym,1)+"-01",label:ymLabel(ym),tag:ym}; }
function rangeOf(period,date){
  if(period==="day") return {kind:"day",from:date,to:addDays(date,1),label:dLabel(date),tag:date};
  if(period==="week"){ const s=addDays(date,-dowOf(date)), e=addDays(s,6); return {kind:"week",from:s,to:addDays(e,1),label:`שבוע ${dShort(s)} – ${dShort(e)}`,tag:`שבוע-${s}`}; }
  return monthRange(date.slice(0,7));
}

async function deleteUser(u){

  try{ await api("delete_user",{user_id:u.id}); closeModal(); toast(`${u.name} נמחק/ה מהמערכת`); refresh(); }
  catch(x){ toast(apiErr(x),4000); }
}

const KIND_HE={work:"עבודה",vacation:"חופש",sick:"מחלה"};
function rangeDays(R){ const out=[]; for(let d=R.from; d<R.to; d=addDays(d,1)) out.push(d); return out; }
function reportRows(list,R){ const map={}; list.forEach(e=>map[e.day]=e); return rangeDays(R).map(day=>{ const e=map[day], m=entryMin(e); return {day,dow:dowOf(day),e,m,o:splitOT(m)}; }); }
const fileBase=(name,R)=>`דוח נוכחות ${PERIOD_HE[R.kind]} - ${name} - ${R.tag}`.replace(/[\\/:*?"<>|]/g,"");
const nowStamp=()=>new Date().toLocaleString("he-IL",{dateStyle:"short",timeStyle:"short"});
function repHead(title,sub){ const c=S.cfg, det=[c.companyId?"ח.פ "+esc(c.companyId):"",esc(c.address||""),c.phone?`<span dir="ltr">${esc(c.phone)}</span>`:""].filter(Boolean).join(" · ");
  return `<div class="rh"><div><div class="co">${esc(c.company||"")}</div>${det?`<div style="font-size:10.5px;color:#475569">${det}</div>`:""}<h1>${title}</h1>${sub?`<div style="font-size:12px">${sub}</div>`:""}</div><div style="text-align:left;font-size:11px"><img src="logo.png" alt="" style="height:30px;display:block;margin:0 0 4px auto">הופק: ${nowStamp()}</div></div>`; }
function reportHTML(user,list,R){
  const ot=S.cfg.overtime!==false, rows=reportRows(list,R), s=summarize(list);
  return `<div class="rep">${repHead(`דוח נוכחות ${PERIOD_HE[R.kind]}`,"")}
    <div class="meta"><div>עובד/ת: <b>${esc(user.name)}</b></div><div>מס׳ עובד: <b>${esc(user.emp_no||"—")}</b></div><div>סניף: <b>${esc(user.branch||"—")}</b></div><div>תקופה: <b>${esc(R.label)}</b></div></div>
    <table><thead><tr><th>תאריך</th><th>יום</th><th>סוג</th><th>כניסה</th><th>יציאה</th><th>הפסקה</th><th>סה״כ</th>${ot?"<th>רגילות</th><th>125%</th><th>150%</th>":""}<th>הערה</th></tr></thead><tbody>
    ${rows.map(r=>{ const e=r.e, w=e&&e.kind==="work"; return `<tr class="${r.dow===5||r.dow===6?"we":""}${e&&e.kind!=="work"?" k-"+e.kind:""}"><td>${dShort(r.day).slice(0,-5)}</td><td>${HEB_DAYS[r.dow]}</td><td>${e?KIND_HE[e.kind]:""}</td><td class="tm">${w?hhmm(e.start_time):""}</td><td class="tm">${w?hhmm(e.end_time):""}</td><td>${w&&e.break_min?e.break_min+"′":""}</td><td class="tm">${w?decH(r.m):""}</td>${ot?`<td class="tm">${w?decH(r.o.reg):""}</td><td class="tm">${w&&r.o.o1?decH(r.o.o1):""}</td><td class="tm">${w&&r.o.o2?decH(r.o.o2):""}</td>`:""}<td class="nt">${e?esc(e.note):""}</td></tr>`; }).join("")}
    </tbody></table>
    <div class="sum"><div>ימי עבודה<b>${s.days}</b></div><div>סה״כ שעות<b dir="ltr">${decH(s.min)} (${fmtH(s.min)})</b></div>${ot?`<div>שעות רגילות<b dir="ltr">${decH(s.reg)}</b></div><div>נוספות 125% / 150%<b dir="ltr">${decH(s.o1)} / ${decH(s.o2)}</b></div>`:""}<div class="k-vacation">ימי חופש<b>${s.vac}</b></div><div class="k-sick">ימי מחלה<b>${s.sick}</b></div></div>
    <div class="sig"><div>חתימת העובד/ת</div><div>חתימת המנהל/ת</div></div>
    <div class="foot">השעות מוצגות בשעות עשרוניות (8.50 = 8 שעות ו-30 דקות). ההפסקות אינן נכללות בסה״כ.${ot?` שעות נוספות מחושבות מעבר ל-${S.cfg.stdHours||8.6} שעות ביום.`:""}</div></div>`;
}
function combinedHTML(packs,R){
  const ot=S.cfg.overtime!==false, T={days:0,min:0,reg:0,o1:0,o2:0,vac:0,sick:0};
  const sums=packs.map(p=>{ const s=summarize(p.list); Object.keys(T).forEach(k=>T[k]+=s[k]); return {p,s}; });
  const det=[]; packs.forEach(p=>{ const map={}; p.list.forEach(e=>map[e.day]=e);
    rangeDays(R).forEach(day=>{ const e=map[day]; if(e||R.kind==="day") det.push({u:p.user,day,e,m:entryMin(e)}); }); });
  return `<div class="rep">${repHead(`דוח נוכחות ${PERIOD_HE[R.kind]} מרוכז`,`תקופה: <b>${esc(R.label)}</b> · ${packs.length} עובדים`)}
    <h3 style="font-size:13px;margin:6px 0">סיכום לפי עובד</h3>
    <table><thead><tr><th>עובד/ת</th><th>מס׳</th><th>סניף</th><th>ימי עבודה</th><th>סה״כ שעות</th>${ot?"<th>רגילות</th><th>125%</th><th>150%</th>":""}<th>חופש</th><th>מחלה</th></tr></thead><tbody>
    ${sums.map(({p,s})=>`<tr><td style="text-align:right">${esc(p.user.name)}</td><td>${esc(p.user.emp_no||"")}</td><td>${esc(p.user.branch||"")}</td><td>${s.days}</td><td class="tm">${decH(s.min)}</td>${ot?`<td class="tm">${decH(s.reg)}</td><td class="tm">${decH(s.o1)}</td><td class="tm">${decH(s.o2)}</td>`:""}<td>${s.vac}</td><td>${s.sick}</td></tr>`).join("")}
    <tr style="font-weight:700;background:#eef5fd"><td style="text-align:right">סה״כ</td><td></td><td></td><td>${T.days}</td><td class="tm">${decH(T.min)}</td>${ot?`<td class="tm">${decH(T.reg)}</td><td class="tm">${decH(T.o1)}</td><td class="tm">${decH(T.o2)}</td>`:""}<td>${T.vac}</td><td>${T.sick}</td></tr></tbody></table>
    <h3 style="font-size:13px;margin:14px 0 6px">פירוט</h3>
    ${det.length?`<table><thead><tr><th>עובד/ת</th><th>תאריך</th><th>יום</th><th>סוג</th><th>כניסה</th><th>יציאה</th><th>הפסקה</th><th>סה״כ</th><th>הערה</th></tr></thead><tbody>
    ${det.map(r=>{ const e=r.e, w=e&&e.kind==="work"; return `<tr class="${e&&e.kind!=="work"?"k-"+e.kind:""}"><td style="text-align:right">${esc(r.u.name)}</td><td>${dShort(r.day).slice(0,-5)}</td><td>${HEB_DAYS[dowOf(r.day)]}</td><td>${e?KIND_HE[e.kind]:"לא הוזן"}</td><td class="tm">${w?hhmm(e.start_time):""}</td><td class="tm">${w?hhmm(e.end_time):""}</td><td>${w&&e.break_min?e.break_min+"′":""}</td><td class="tm">${w?decH(r.m):""}</td><td class="nt">${e?esc(e.note):""}</td></tr>`; }).join("")}</tbody></table>`:`<p>אין רישומים בתקופה הזו.</p>`}
    <div class="foot">השעות מוצגות בשעות עשרוניות (8.50 = 8 שעות ו-30 דקות). ההפסקות אינן נכללות בסה״כ.</div></div>`;
}
let PDF_P=null;
function loadPDF(){ if(window.html2pdf) return Promise.resolve(); if(!PDF_P) PDF_P=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="lib/html2pdf.bundle.min.js"; sc.onload=res; sc.onerror=()=>{ PDF_P=null; rej(); }; document.head.appendChild(sc); }); return PDF_P; }
const PDF_W=718;
async function downloadPDF(packs,R,combined){
  if(!packs.length) return toast("אין נתונים לדוח");
  toast("מכין את קובץ ה-PDF…",8000);
  try{ await loadPDF(); }catch(e){ return toast("לא הצלחתי לטעון את רכיב ה-PDF. בדקו את החיבור ונסו שוב."); }
  const host=document.createElement("div"); host.className="pdf-host";
  host.innerHTML=`<div class="pdf-doc">${combined?combinedHTML(packs,R):packs.map(p=>reportHTML(p.user,p.list,R)).join("")}</div>`;
  document.body.appendChild(host); const doc=host.firstElementChild;
  const name=(packs.length===1&&!combined?fileBase(packs[0].user.name,R):fileBase(combined?"מרוכז":"עובדים",R))+".pdf";
  try{
    await Promise.all([...host.querySelectorAll("img")].map(im=>im.complete?0:new Promise(r=>{ im.onload=im.onerror=r; })));
    // A4 = 210mm; 10mm margins each side → 190mm print width = 718px. Render the report at exactly that width,
    // independent of the phone's screen width, so nothing spills past the margins.
    await html2pdf().set({margin:[10,10,12,10],filename:name,image:{type:"jpeg",quality:0.95},html2canvas:{scale:2,backgroundColor:"#ffffff",scrollX:0,scrollY:0},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"],avoid:["tr",".sum",".sig",".rh",".meta",".foot"]}}).from(doc).save();
    toast("הקובץ ירד ✓");
  }catch(e){ console.error(e); toast("יצירת ה-PDF נכשלה. נסו שוב."); }
  host.remove();
}

/* ========================== boot ========================== */
(async()=>{
  try{
    const cfg=await (await fetch("/api/config")).json();
    if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase) return renderSetupNeeded();
    PUSH.key=cfg.vapidPublicKey||""; if(PUSH.key) swReady();
    S.sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,storageKey:"lirad.sb",autoRefreshToken:true,detectSessionInUrl:false}});
  }catch(e){ return renderSetupNeeded(); }
  await loadCfg();
  const {data:{session}}=await S.sb.auth.getSession();
  if(session) return enter(null);
  try{ const h=await (await fetch("/api/admin")).json(); if(h.needsSetup) return renderFirstRun(); }catch(e){}
  renderLanding();
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.me&&!$(".modal")&&S.tab!=="reports") refresh(); });
</script>
